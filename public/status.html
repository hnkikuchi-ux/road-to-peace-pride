<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>SYSTEM STATUS | ROAD TO PEACE PRIDE</title><style>
*{box-sizing:border-box}body{margin:0;background:#061226;color:#fff;font-family:system-ui,"Yu Gothic",sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 12%,rgba(232,199,112,.22),transparent 14%),linear-gradient(#171b45,#061226 74%)}.wrap{width:min(92%,760px);margin:auto;padding:28px 0 70px}.ey{font-size:10px;letter-spacing:.2em;color:#efd98d;font-weight:800}h1{font-family:"Yu Mincho",serif;font-weight:500}.card{border:1px solid rgba(216,184,102,.32);background:rgba(6,18,38,.82);padding:17px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid rgba(216,184,102,.16);padding:13px 0}.row:first-child{border-top:0}.note{font-size:12px;color:#adb5c6;line-height:1.6}.badge{border:1px solid rgba(216,184,102,.4);border-radius:999px;padding:5px 9px;color:#efd98d;font-size:10px;white-space:nowrap}.badge.ok{color:#b9e8c6;border-color:rgba(185,232,198,.45)}.badge.warn{color:#f5cf99;border-color:rgba(245,207,153,.45)}a{color:#efd98d}.btn{border:1px solid rgba(216,184,102,.45);background:rgba(255,255,255,.04);color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}.cta{margin-top:15px;padding:14px;border:1px solid rgba(216,184,102,.24);background:rgba(255,255,255,.025);font-size:12px;line-height:1.8}.links{margin-top:16px;line-height:2}.version{margin-top:14px;font-size:11px;color:#8d96aa}
</style></head><body><div class="wrap"><div class="ey">SYSTEM HEALTH</div><h1>本番接続診断</h1><p class="note">ROAD TO PEACE PRIDE / MEMORIAL COLLECTION 2026</p><div id="box" class="card">確認中…</div><div id="next" class="cta"></div><button id="retry" class="btn">再チェック</button><div class="links"><a href="./admin.html">管理画面</a> / <a href="./author.html">投稿画面</a> / <a href="./index.html">公開ブック</a></div><div id="version" class="version"></div></div>
<script>
const box=document.querySelector('#box'),next=document.querySelector('#next'),version=document.querySelector('#version');
function fmt(v){if(!v)return'未設定';try{return new Intl.DateTimeFormat('ja-JP',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}}
function addRow(label,badge,desc,kind=''){const row=document.createElement('div');row.className='row';const left=document.createElement('div'),b=document.createElement('b'),n=document.createElement('div'),pill=document.createElement('span');b.textContent=label;n.className='note';n.textContent=desc||'';left.append(b,n);pill.className='badge '+kind;pill.textContent=badge;row.append(left,pill);box.append(row)}
async function loadVersion(){try{const r=await fetch('./version.json',{cache:'no-store'});const d=await r.json();version.textContent=`BUILD: ${d.build||'-'} ｜ ${d.updated_at||''}`}catch{version.textContent='BUILD情報を取得できませんでした。'}}
async function run(){box.textContent='';next.textContent='';try{const r=await fetch('/api/health',{cache:'no-store',credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);const security=d.securityGuard==='v1',ready=d.viewerPasswordConfigured&&d.adminPasswordConfigured&&d.emailConfigured&&d.storageConfigured&&security;addRow('Cloudflare Worker','OK',d.worker||'API応答','ok');addRow('Security Guard',security?'ACTIVE':'CHECK',security?'管理者認証・PREVIEW書込み保護が有効':'secure-workerの反映を確認',security?'ok':'warn');addRow('Mode',d.preview?'PREVIEW':'PRODUCTION',d.preview?'確認用モード':'本番モード',d.preview?'warn':'ok');addRow('PREVIEW原稿保存',d.previewSubmissionsAllowed?'CLOUD ON':'LOCAL ONLY',d.preview?(d.previewSubmissionsAllowed?'PREVIEWでもクラウド保存を許可':'安全のため端末保存のみ'):'本番ではクラウド保存',d.preview&&!d.previewSubmissionsAllowed?'ok':'');addRow('Production readiness',ready?'READY':'CONNECT',ready?'本番切替の主要条件がそろっています':'未設定・未反映項目があります',ready?'ok':'warn');addRow('D1 Database',d.ok?'READY':'ERROR',`登録原稿 ${d.stories??0} 件 / 対象 ${d.targetCount??300} 人`,d.ok?'ok':'warn');addRow('Photo Storage',d.storageConfigured?'READY':'ERROR','Cloudflare KV / MEDIA',d.storageConfigured?'ok':'warn');addRow('閲覧パスワード',d.viewerPasswordConfigured?'CONFIGURED':'NOT SET',d.viewerPasswordConfigured?'設定済':'管理画面で設定してください',d.viewerPasswordConfigured?'ok':'warn');addRow('管理者パスワード',d.adminPasswordConfigured?'CONFIGURED':'NOT SET',d.adminDemoDisabled?'簡易デモコードは無効':'管理者認証を確認',d.adminPasswordConfigured?'ok':'warn');addRow('Email OTP',d.emailConfigured?'READY':'CONNECT',d.emailConfigured?'送信設定済':'Brevo設定とテスト送信が必要',d.emailConfigured?'ok':'warn');addRow('文集閲覧',d.bookOpen?'OPEN':'PAUSED',d.bookOpen?'閲覧可能':'管理画面で一時停止中',d.bookOpen?'ok':'warn');addRow('原稿締切',d.deadlinePassed?'CLOSED':(d.submissionDeadline?'SCHEDULED':'OPEN'),d.submissionDeadline?fmt(d.submissionDeadline):'締切未設定',d.deadlinePassed?'warn':'');const todo=[];if(!security)todo.push('Cloudflareへsecure-worker版が反映されたことを確認');if(!d.viewerPasswordConfigured)todo.push('管理画面で閲覧パスワードを設定');if(!d.adminPasswordConfigured)todo.push('初回はSETUP_KEYで管理画面へ入り、管理者パスワードを設定');if(!d.emailConfigured)todo.push('Brevo APIキーと送信元メールを設定し、テスト送信');if(!d.storageConfigured)todo.push('Cloudflare KV / MEDIA bindingを確認');if(ready&&d.preview)todo.push('投稿・閲覧テスト後、管理画面からPRODUCTIONへ切替');if(!todo.length&&!d.preview)todo.push('本番稼働中。定期バックアップと投稿状況の確認を継続');const strong=document.createElement('b');strong.textContent='NEXT ACTION';next.append(strong,document.createElement('br'));todo.forEach((x,i)=>next.append(document.createTextNode(`${i+1}. ${x}`),document.createElement('br')))}catch(e){box.textContent='';addRow('API','ERROR',String(e),'warn');next.textContent='GitHub→Cloudflareのデプロイ状況を確認してください。'}await loadVersion()}
document.querySelector('#retry').onclick=run;run();
</script></body></html>
