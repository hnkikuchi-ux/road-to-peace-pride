<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYSTEM STATUS | ROAD TO PEACE PRIDE</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#151a42,#061226);color:#fff;font-family:system-ui,"Yu Gothic",sans-serif;min-height:100vh}.wrap{width:min(92%,680px);margin:auto;padding:28px 0 70px}.ey{font-size:10px;letter-spacing:.2em;color:#efd98d;font-weight:800}h1{font-family:"Yu Mincho",serif;font-weight:500}.card{border:1px solid rgba(216,184,102,.32);background:rgba(6,18,38,.78);padding:17px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid rgba(216,184,102,.16);padding:13px 0}.row:first-child{border-top:0}.note{font-size:12px;color:#adb5c6;line-height:1.6}.badge{border:1px solid rgba(216,184,102,.4);border-radius:999px;padding:5px 9px;color:#efd98d;font-size:10px}.ok{color:#a9e2bb}.warn{color:#f3c0a9}a{color:#efd98d}.btn{border:1px solid rgba(216,184,102,.45);background:rgba(255,255,255,.04);color:#fff;border-radius:999px;padding:10px 15px}</style></head><body><div class="wrap"><div class="ey">SYSTEM HEALTH</div><h1>本番接続診断</h1><p class="note">ROAD TO PEACE PRIDE / MEMORIAL COLLECTION 2026</p><div id="box" class="card">確認中…</div><button id="retry" class="btn">再チェック</button> <a href="./admin.html">管理画面</a> / <a href="./index.html">公開ブック</a></div><script>const box=document.querySelector('#box');function row(a,b,c=''){return `<div class="row"><div><b>${a}</b><div class="note">${c}</div></div><span class="badge">${b}</span></div>`}function fmt(v){if(!v)return'未設定';try{return new Intl.DateTimeFormat('ja-JP',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return v}}async function run(){box.textContent='確認中…';try{const r=await fetch('/api/health',{cache:'no-store'}),d=await r.json();const ready=d.viewerPasswordConfigured&&d.adminPasswordConfigured&&d.emailConfigured;box.innerHTML=row('Cloudflare Worker',r.ok?'OK':'ERROR','API応答')+row('Mode',d.preview?'PREVIEW':'PRODUCTION',d.preview?'確認用モード':'本番モード')+row('Production readiness',ready?'READY':'CONNECT',ready?'本番用Secrets設定済':'本番用パスワードまたはメール設定が未完了')+row('D1 Database',d.ok?'READY':'ERROR',`登録原稿 ${d.stories??0} 件 / 対象 ${d.targetCount??300} 人`)+row('Photo Storage',d.storageConfigured?'READY':'ERROR','Cloudflare KV / MEDIA')+row('閲覧パスワード',d.viewerPasswordConfigured?'CONFIGURED':(d.preview?'DEMO':'NOT SET'),d.preview&&!d.viewerPasswordConfigured?'現在は demo':'Worker側で管理')+row('管理者パスワード',d.adminPasswordConfigured?'CONFIGURED':(d.preview?'DEMO':'NOT SET'),'Worker Secretで管理')+row('Email OTP',d.emailConfigured?'READY':'CONNECT',d.emailConfigured?'メール送信設定済':'Brevo等の送信設定が必要')+row('文集閲覧',d.bookOpen?'OPEN':'PAUSED',d.bookOpen?'閲覧可能':'管理画面で一時停止中')+row('原稿締切',d.deadlinePassed?'CLOSED':(d.submissionDeadline?'SCHEDULED':'OPEN'),d.submissionDeadline?fmt(d.submissionDeadline):'締切未設定')}catch(e){box.innerHTML=row('API','ERROR',String(e))}}document.querySelector('#retry').onclick=run;run();</script></body></html>
