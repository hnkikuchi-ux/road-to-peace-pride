      <stop offset="0.34" stop-color="#fff0a6"/>
      <stop offset="0.53" stop-color="#c8841e"/>
      <stop offset="0.72" stop-color="#f6d66f"/>
      <stop offset="1" stop-color="#754105"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
