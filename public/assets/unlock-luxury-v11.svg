<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-label="Refined luxury gold button plate">
<defs>
  <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7b4306"/><stop offset=".18" stop-color="#e9bd55"/><stop offset=".36" stop-color="#fff0a1"/><stop offset=".57" stop-color="#b97112"/><stop offset=".78" stop-color="#f4cb62"/><stop offset="1" stop-color="#7b4306"/>
  </linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5d57b"/><stop offset=".22" stop-color="#d39a30"/><stop offset=".50" stop-color="#e9ba4f"/><stop offset=".78" stop-color="#bd7a19"/><stop offset="1" stop-color="#8a4b07"/>
  </linearGradient>
  <linearGradient id="fine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b4d06"/><stop offset=".20" stop-color="#ffe698"/><stop offset=".50" stop-color="#fff4bd"/><stop offset=".80" stop-color="#d59020"/><stop offset="1" stop-color="#7b4305"/>
  </linearGradient>
  <radialGradient id="center" cx="50%" cy="25%" r="80%">
    <stop offset="0" stop-color="#fff4c2" stop-opacity=".38"/><stop offset=".38" stop-color="#ffd56a" stop-opacity=".10"/><stop offset="1" stop-color="#6c3905" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
    <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".38"/>
    <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#e7b348" flood-opacity=".16"/>
  </filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<g filter="url(#shadow)">
  <!-- strong primary outer frame -->
  <path d="M94 26h1212l48 48v172l-48 48H94l-48-48V74z" fill="url(#outer)"/>
  <!-- restrained dark separator -->
  <path d="M110 42h1180l36 36v164l-36 36H110l-36-36V78z" fill="#3a1d03" opacity=".48"/>
  <!-- single main face -->
  <path d="M126 58h1148l28 28v148l-28 28H126l-28-28V86z" fill="url(#face)"/>
  <path d="M126 58h1148l28 28v148l-28 28H126l-28-28V86z" fill="url(#center)"/>
  <!-- one clear inner frame -->
  <path d="M150 80h1100l18 18v104l-18 18H150l-18-18V98z" fill="none" stroke="#fff0a4" stroke-opacity=".66" stroke-width="3"/>
  <path d="M164 94h1072l12 12v76l-12 12H164l-12-12v-76z" fill="none" stroke="url(#fine)" stroke-width="2.2"/>
</g>
<!-- simple art-deco side ornaments -->
<g fill="none" stroke="url(#fine)" stroke-width="3" opacity=".95">
  <path d="M158 160h70l28-28 28 28-28 28-28-28h-70"/>
  <path d="M1242 160h-70l-28-28-28 28 28 28 28-28h70"/>
</g>
<g fill="#ffe79a" opacity=".96">
  <path d="M256 145l15 15-15 15-15-15z"/><path d="M1144 145l15 15-15 15-15-15z"/>
</g>
<g fill="#8c4c07"><path d="M256 152l8 8-8 8-8-8z"/><path d="M1144 152l8 8-8 8-8-8z"/></g>
<!-- subtle highlights only -->
<g opacity=".78">
  <ellipse cx="700" cy="62" rx="150" ry="15" fill="#fff6c7" opacity=".15" filter="url(#soft)"/>
  <path d="M700 38v48M676 62h48" stroke="#fff3b2" stroke-width="2.8"/>
  <circle cx="700" cy="62" r="5" fill="#fff7d1"/>
  <path d="M92 160h34M1274 160h34" stroke="#fff0a0" stroke-width="2.4"/>
</g>
</svg>
