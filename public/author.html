<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061226">
<title>WRITE YOUR STORY | ROAD TO PEACE PRIDE</title>
<style>
:root{--n:#061226;--g:#d8b866;--g2:#efd98d;--m:#aeb5c5;--ok:#a9e2bb;--warn:#f3c0a9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#061226;color:#fff;font-family:ui-sans-serif,system-ui,"Yu Gothic",sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 15%,rgba(232,199,112,.24),transparent 14%),linear-gradient(180deg,#181b46,#0c1631 44%,#061226 78%)}body:after{content:"";position:fixed;left:50%;bottom:-12vh;z-index:-2;width:35vw;min-width:190px;height:86vh;transform:translateX(-50%) perspective(500px) rotateX(68deg);transform-origin:bottom;background:linear-gradient(180deg,transparent,rgba(242,194,70,.22));filter:blur(10px);clip-path:polygon(45% 0,55% 0,96% 100%,4% 100%)}.wrap{width:min(100%,680px);margin:auto;padding:22px 14px 84px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-family:ui-serif,"Yu Mincho",serif;letter-spacing:.11em}.pill,.btn{border:1px solid rgba(216,184,102,.45);border-radius:999px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;padding:10px 15px;cursor:pointer}.btn:disabled{opacity:.45}.panel{border:1px solid rgba(216,184,102,.32);background:rgba(6,18,38,.78);backdrop-filter:blur(12px);padding:22px 18px;margin-bottom:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.ey{color:var(--g2);font-size:10px;font-weight:800;letter-spacing:.24em}.panel h1{font-family:ui-serif,"Yu Mincho",serif;font-weight:500;letter-spacing:.06em;margin:10px 0 8px}.note{font-size:12px;line-height:1.7;color:var(--m)}.field{margin:14px 0}label{display:block;font-size:12px;color:#e9dfc1;margin:0 0 6px}input,select,textarea{width:100%;border:1px solid rgba(216,184,102,.35);border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:12px 13px;font-size:15px;outline:none}textarea{min-height:260px;resize:vertical;line-height:1.8}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(216,184,102,.1)}select option{color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.count{text-align:right;font-size:11px;color:var(--m);margin-top:5px}.stack{display:grid;gap:9px}.primary{background:linear-gradient(135deg,#b88e3c,#efd98d);color:#1b1305;font-weight:800;border:0;width:100%;min-height:48px}.secondary{width:100%;min-height:46px}.status{padding:10px 12px;border:1px solid rgba(216,184,102,.25);background:rgba(255,255,255,.03);font-size:12px;line-height:1.7}.deadline{margin-top:10px;padding:10px 12px;border-left:3px solid var(--g);background:rgba(216,184,102,.08)}.deadline.closed{border-color:#e59b87;background:rgba(229,155,135,.08)}.hidden{display:none!important}.ok{color:var(--ok)}.warn{color:var(--warn)}.previewbar{position:fixed;left:0;right:0;bottom:0;background:#efd98d;color:#221706;font-size:11px;font-weight:800;text-align:center;padding:8px;z-index:20}.photo-preview{width:min(100%,320px);max-height:280px;object-fit:cover;border:1px solid rgba(216,184,102,.5);margin-top:10px}.save-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{border:1px solid rgba(216,184,102,.35);border-radius:999px;padding:5px 9px;color:var(--g2);font-size:10px}.muted{opacity:.55;pointer-events:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:grid;place-items:center;padding:14px}.paper{width:min(100%,620px);max-height:92vh;overflow:auto;background:#f5efdf;color:#1b1b1b;border:1px solid #cdb36e;padding:28px 22px}.paper h2{text-align:center;font-family:"Yu Mincho",serif;font-weight:500;font-size:26px;line-height:1.5}.pmeta{text-align:center;color:#655e52;font-size:12px;line-height:1.8}.pbody{white-space:pre-wrap;font-family:"Yu Mincho",serif;font-size:16px;line-height:2}.preview-actions{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">WRITE YOUR STORY</div><a class="pill" href="./index.html">公開ブック</a></div>

  <section id="auth" class="panel">
    <div class="ey">AUTHOR ACCESS</div><h1>あなたの原稿を書く</h1>
    <p class="note">Googleアカウントは不要です。メールに届く6桁コードで本人確認します。この端末ではログイン状態を保持します。</p>
    <div id="deadlineAuth" class="deadline hidden"></div>
    <div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="example@email.com"></div>
    <button id="send" class="btn primary">認証コードを送信</button>
    <div id="otpbox" class="hidden"><div class="field"><label>6桁認証コード</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6桁コード"></div><button id="verify" class="btn primary">認証する</button></div>
    <div id="authmsg" class="note"></div>
  </section>

  <section id="editor" class="hidden">
    <div class="panel">
      <div class="save-row"><div><div class="ey">MY STORY</div><h1>原稿の入力・編集</h1></div><span id="statusBadge" class="badge">下書き</span></div>
      <div class="status"><b>SAVE STATUS</b><br><span id="saveState">入力内容はこの端末に自動保存します。</span></div>
      <div id="deadlineEditor" class="deadline hidden"></div>
      <div id="formArea">
        <div class="field"><label>記載日付</label><input id="record_date" type="date"></div>
        <div class="grid">
          <div class="field"><label>総区</label><input id="soku" maxlength="100" placeholder="例：〇〇総区"></div>
          <div class="field"><label>分区</label><input id="bunku" maxlength="100" placeholder="例：〇〇分区（該当しない場合は空欄）"></div>
          <div class="field"><label>本部</label><input id="honbu" maxlength="100" placeholder="例：〇〇本部"></div>
          <div class="field"><label>支部</label><input id="shibu" maxlength="100" placeholder="例：〇〇支部"></div>
        </div>
        <div class="field"><label>カテゴリー</label><select id="category"><option>体験談</option><option>活動報告</option><option>決意</option><option>その他</option></select></div>
        <div class="field"><label>氏名</label><input id="name" autocomplete="name" maxlength="200" placeholder="氏名"></div>
        <div class="field"><label>題名（40字以内）</label><input id="title" maxlength="40" placeholder="題名"><div id="titleCount" class="count">0 / 40</div></div>
        <div class="field"><label>本文（1000字程度）</label><textarea id="body" maxlength="10000" placeholder="原文をそのまま入力してください。AIによる自動校正・要約・言い換えは行いません。"></textarea><div id="bodyCount" class="count">0字</div></div>
        <div class="field"><label>写真（1枚）</label><input id="photo" type="file" accept="image/*"><img id="photoPreview" class="photo-preview hidden" alt="選択した写真"><div class="note">アップロード前に最大1600pxへ圧縮し、JPEG再生成で通常の位置情報等のメタデータを除去します。</div></div>
        <label style="display:flex;gap:8px;align-items:flex-start;margin:18px 0"><input id="confirm" type="checkbox" style="width:auto;margin-top:3px"><span class="note">掲載内容と写真を確認しました</span></label>
        <div class="stack"><button id="save" class="btn secondary">下書き保存</button><button id="previewBtn" class="btn secondary">掲載イメージを確認</button><button id="submit" class="btn primary">提出する</button><button id="export" class="btn secondary">自分の原稿を端末に保存</button><button id="logout" class="btn secondary">この端末からログアウト</button></div>
      </div>
      <div id="savemsg" class="note"></div>
    </div>
  </section>
</div>
<div id="previewBar" class="previewbar hidden">PREVIEW MODE｜原稿・写真はCloudflareへ保存せず、この端末だけに保存します。</div>
<div id="storyPreview" class="modal hidden"><article class="paper"><div class="ey" style="text-align:center;color:#8d6b25">PREVIEW</div><h2 id="pTitle"></h2><div id="pMeta" class="pmeta"></div><hr><div id="pBody" class="pbody"></div><div class="preview-actions"><button id="closePreview" class="btn" style="color:#221706">編集に戻る</button><button id="submitPreview" class="btn primary" style="width:auto">この内容で提出</button></div></article></div>
<script>
const $=s=>document.querySelector(s);
let email='',serverTimer=null,config={};
const ids=['record_date','soku','bunku','honbu','shibu','category','name','title','body'];
const localKey=()=>`rpp_draft_${email||$('#email').value.trim().toLowerCase()||'unknown'}`;
function setMsg(t,c=''){const e=$('#savemsg');e.textContent=t;e.className='note '+c}
function data(status){return{record_date:$('#record_date').value,soku:$('#soku').value.trim(),bunku:$('#bunku').value.trim(),honbu:$('#honbu').value.trim(),shibu:$('#shibu').value.trim(),category:$('#category').value,name:$('#name').value.trim(),title:$('#title').value,body:$('#body').value,status}}
function counts(){$('#titleCount').textContent=[...$('#title').value].length+' / 40';$('#bodyCount').textContent=[...$('#body').value].length+'字'}
function currentStatus(){return $('#statusBadge').textContent==='提出済'?'submitted':'draft'}
function saveLocal(status=currentStatus()){try{localStorage.setItem(localKey(),JSON.stringify({...data(status),saved_at:new Date().toISOString()}));$('#saveState').textContent=config.preview?'PREVIEW：この端末に保存済':'この端末に保存済・Cloudflareへ自動保存します'}catch{}}
function fill(s){if(!s)return;ids.forEach(id=>{if(s[id]!=null)$('#'+id).value=s[id]});$('#statusBadge').textContent=s.status==='submitted'?'提出済':'下書き';counts()}
function fmt(v){try{return new Intl.DateTimeFormat('ja-JP',{dateStyle:'long',timeStyle:'short'}).format(new Date(v))}catch{return v}}
function applyConfig(d){config=d||{};$('#previewBar').classList.toggle('hidden',!config.preview);const text=config.submissionDeadline?(config.deadlinePassed?`原稿受付は ${fmt(config.submissionDeadline)} で終了しました。現在は閲覧のみです。`:`原稿の編集・提出期限：${fmt(config.submissionDeadline)}`):'原稿の締切は現在設定されていません。';for(const id of ['deadlineAuth','deadlineEditor']){$('#'+id).textContent=text;$('#'+id).classList.remove('hidden');$('#'+id).classList.toggle('closed',!!config.deadlinePassed)}if(config.deadlinePassed){$('#send').disabled=true;$('#formArea').classList.add('muted')}if(config.preview)$('#saveState').textContent='PREVIEW：入力内容はこの端末だけに保存します。';else $('#saveState').textContent='入力内容は端末へ即時保存し、20秒ごとにCloudflareへ保存します。'}
async function health(){try{const r=await fetch('/api/config',{cache:'no-store',credentials:'same-origin'});if(r.ok)applyConfig(await r.json())}catch{}}
async function openEditor(){const r=await fetch('/api/me/story',{credentials:'same-origin'});if(!r.ok)return false;const d=await r.json();applyConfig(d);email=d.email||email;$('#auth').classList.add('hidden');$('#editor').classList.remove('hidden');let local=null;try{local=JSON.parse(localStorage.getItem(localKey())||'null')}catch{};if(d.story)fill(d.story);else if(local)fill(local);if(!$('#record_date').value)$('#record_date').value=new Date().toISOString().slice(0,10);startAutosave();return true}
$('#send').onclick=async()=>{email=$('#email').value.trim().toLowerCase();if(!email){$('#authmsg').textContent='メールアドレスを入力してください。';return}$('#send').disabled=true;try{const r=await fetch('/api/auth/request',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email})});const d=await r.json();if(!r.ok){$('#authmsg').textContent=d.error||'送信できませんでした。';return}$('#otpbox').classList.remove('hidden');$('#authmsg').textContent=d.previewCode?`PREVIEW用認証コード：${d.previewCode}`:'6桁の認証コードをメールに送りました。'}catch{$('#authmsg').textContent='通信できませんでした。'}finally{$('#send').disabled=!!config.deadlinePassed}};
$('#verify').onclick=async()=>{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email||$('#email').value.trim().toLowerCase(),code:$('#otp').value.trim()})});const d=await r.json();if(!r.ok){$('#authmsg').textContent=d.error||'認証できませんでした。';return}email=d.email;await openEditor()};
async function saveServer(status,silent=false){saveLocal(status);if(config.deadlinePassed){if(!silent)setMsg('締切後のため保存できません。','warn');return false}if(config.preview){$('#statusBadge').textContent=status==='submitted'?'提出済':'下書き';$('#saveState').textContent='PREVIEW：この端末に保存済';if(!silent)setMsg(status==='submitted'?'PREVIEWでは提出内容を端末に保存しました。本番データには登録されません。':'下書きをこの端末に保存しました。','ok');return true}$('#saveState').textContent='Cloudflareへ保存中…';const r=await fetch('/api/me/story',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data(status))});const d=await r.json();if(!r.ok){$('#saveState').textContent='クラウド保存エラー';if(!silent)setMsg(d.error||'保存できませんでした。','warn');return false}applyConfig(d);fill(d.story);$('#saveState').textContent='端末＋Cloudflareに保存済';if(!silent)setMsg(status==='submitted'?'提出しました。締切までは再編集できます。':'下書きを保存しました。','ok');return true}
function startAutosave(){clearInterval(serverTimer);serverTimer=setInterval(()=>{if(config.preview||$('#editor').classList.contains('hidden')||config.deadlinePassed)return;const d=data('draft');if(d.name||d.title||d.body)saveServer(currentStatus(),true)},20000)}
ids.forEach(id=>{$('#'+id).addEventListener('input',()=>{counts();saveLocal()});$('#'+id).addEventListener('change',()=>saveLocal())});
$('#save').onclick=()=>saveServer('draft');
function validateSubmission(){const d=data('submitted');if(!d.name||!d.title||!d.body){setMsg('氏名・題名・本文を入力してください。','warn');return null}if([...d.title].length>40){setMsg('題名は40字以内にしてください。','warn');return null}if(!$('#confirm').checked){setMsg('掲載内容の確認にチェックしてください。','warn');return null}return d}
function showPreview(){const d=data('draft');$('#pTitle').textContent=d.title||'（題名未入力）';$('#pMeta').textContent=[d.record_date,[d.soku,d.bunku,d.honbu,d.shibu].filter(Boolean).join('／'),d.name].filter(Boolean).join(' ｜ ');$('#pBody').textContent=d.body||'（本文未入力）';$('#storyPreview').classList.remove('hidden')}
$('#previewBtn').onclick=showPreview;$('#closePreview').onclick=()=>$('#storyPreview').classList.add('hidden');$('#submit').onclick=()=>{if(validateSubmission())saveServer('submitted')};$('#submitPreview').onclick=()=>{if(validateSubmission()){$('#storyPreview').classList.add('hidden');saveServer('submitted')}};
async function compress(file){const bmp=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像処理失敗')),'image/jpeg',.82))}
$('#photo').onchange=async e=>{const f=e.target.files[0];if(!f||config.deadlinePassed)return;try{const blob=await compress(f),url=URL.createObjectURL(blob);$('#photoPreview').src=url;$('#photoPreview').classList.remove('hidden');if(config.preview){setMsg('PREVIEWでは写真をCloudflareへ送信しません。掲載イメージのみ確認できます。','ok');return}setMsg('写真を保存中…');const r=await fetch('/api/me/photo',{method:'POST',headers:{'Content-Type':'image/jpeg'},credentials:'same-origin',body:blob});const d=await r.json();setMsg(r.ok?'写真を保存しました。':(d.error||'写真を保存できませんでした。'),r.ok?'ok':'warn')}catch{setMsg('写真を処理できませんでした。','warn')}};
$('#export').onclick=()=>{const payload={exported_at:new Date().toISOString(),story:data(currentStatus())},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${($('#name').value||'my-story').replace(/[\\/:*?"<>|]/g,'_')}_原稿バックアップ.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.reload()};
window.addEventListener('beforeunload',()=>saveLocal());
(async()=>{await health();await openEditor()})();
</script>
</body>
</html>
