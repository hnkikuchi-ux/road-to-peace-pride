<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061226"><title>WRITE YOUR STORY | ROAD TO PEACE PRIDE</title><style>:root{--n:#061226;--n2:#101a36;--g:#d8b866;--g2:#efd98d;--m:#aeb5c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a2453,#101936 35%,#061226 78%);color:#fff;font-family:ui-sans-serif,system-ui,"Yu Gothic",sans-serif;min-height:100vh}.wrap{width:min(100%,680px);margin:auto;padding:22px 14px 84px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-family:ui-serif,"Yu Mincho",serif;letter-spacing:.11em}.pill,.btn{border:1px solid rgba(216,184,102,.45);border-radius:999px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;padding:10px 15px;cursor:pointer}.panel{border:1px solid rgba(216,184,102,.32);background:rgba(6,18,38,.74);backdrop-filter:blur(12px);padding:22px 18px;margin-bottom:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.ey{color:var(--g2);font-size:10px;font-weight:800;letter-spacing:.24em}.panel h1{font-family:ui-serif,"Yu Mincho",serif;font-weight:500;letter-spacing:.06em;margin:10px 0 8px}.note{font-size:12px;line-height:1.7;color:var(--m)}.field{margin:14px 0}label{display:block;font-size:12px;color:#e9dfc1;margin:0 0 6px}input,select,textarea{width:100%;border:1px solid rgba(216,184,102,.35);border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:12px 13px;font-size:15px;outline:none}textarea{min-height:260px;resize:vertical;line-height:1.8}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(216,184,102,.1)}select option{color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.count{text-align:right;font-size:11px;color:var(--m);margin-top:5px}.stack{display:grid;gap:9px}.primary{background:linear-gradient(135deg,#b88e3c,#efd98d);color:#1b1305;font-weight:800;border:0;width:100%;min-height:48px}.secondary{width:100%;min-height:46px}.status{padding:10px 12px;border:1px solid rgba(216,184,102,.25);background:rgba(255,255,255,.03);font-size:12px;line-height:1.7}.hidden{display:none}.preview{position:fixed;left:0;right:0;bottom:0;background:#efd98d;color:#221706;font-size:11px;font-weight:800;text-align:center;padding:8px}.ok{color:#a9e2bb}.warn{color:#f3c0a9}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">WRITE YOUR STORY</div><a class="pill" href="./index.html">公開ブック</a></div><section id="auth" class="panel"><div class="ey">AUTHOR ACCESS</div><h1>あなたの原稿を書く</h1><p class="note">本番ではメールに届く6桁コードで本人確認します。現在は公開確認用デモです。</p><div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com"></div><button id="send" class="btn primary">認証コードを送信</button><div id="otpbox" class="hidden"><div class="field"><label>6桁認証コード</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div><button id="verify" class="btn primary">認証する</button></div><div id="authmsg" class="note"></div></section><section id="editor" class="hidden"><div class="panel"><div class="ey">MY STORY</div><h1>原稿の入力・編集</h1><div class="status">端末内にも自動保存します。公開用デモのため、現在はクラウドDBには保存されません。</div><div class="field"><label>記載日付</label><input id="date" type="date"></div><div class="grid"><div class="field"><label>総区</label><input id="soku" placeholder="〇〇総区"></div><div class="field"><label>分区</label><input id="bunku" placeholder="〇〇分区"></div><div class="field"><label>本部</label><input id="honbu" placeholder="〇〇本部"></div><div class="field"><label>支部</label><input id="shibu" placeholder="〇〇支部"></div></div><div class="field"><label>カテゴリー</label><select id="category"><option>体験談</option><option>活動報告</option><option>決意</option><option>その他</option></select></div><div class="field"><label>氏名</label><input id="name" autocomplete="name" placeholder="氏名"></div><div class="field"><label>題名（40字以内）</label><input id="title" maxlength="40" placeholder="題名"><div id="titleCount" class="count">0 / 40</div></div><div class="field"><label>本文（1000字程度）</label><textarea id="body" placeholder="原文をそのまま入力してください。AIによる自動校正・要約・言い換えは行いません。"></textarea><div id="bodyCount" class="count">0字</div></div><div class="field"><label>写真</label><input id="photo" type="file" accept="image/*"><div class="note">本番では1人1枚を自動圧縮して保存します。</div></div><label style="display:flex;gap:8px;align-items:flex-start;margin:18px 0"><input id="confirm" type="checkbox" style="width:auto;margin-top:3px"> <span class="note">掲載内容と写真を確認しました</span></label><div class="stack"><button id="save" class="btn secondary">下書き保存</button><button id="submit" class="btn primary">提出する</button></div><div id="savemsg" class="note"></div></div></section></div><div class="preview">PREVIEW MODE｜投稿者OTP：123456</div><script>const $=s=>document.querySelector(s),key='rpp_author_demo';function msg(t,c=''){const e=$('#savemsg');e.textContent=t;e.className='note '+c}function vals(){return{date:$('#date').value,soku:$('#soku').value,bunku:$('#bunku').value,honbu:$('#honbu').value,shibu:$('#shibu').value,category:$('#category').value,name:$('#name').value,title:$('#title').value,body:$('#body').value,status:'draft',saved_at:new Date().toISOString()}}function saveLocal(show=true){localStorage.setItem(key,JSON.stringify(vals()));if(show)msg('この端末に下書きを保存しました。','ok')}function fill(){try{const d=JSON.parse(localStorage.getItem(key)||'null');if(!d)return;Object.keys(d).forEach(k=>{const e=$('#'+k);if(e&&typeof d[k]==='string')e.value=d[k]});counts()}catch{}}function counts(){$('#titleCount').textContent=[...$('#title').value].length+' / 40';$('#bodyCount').textContent=[...$('#body').value].length+'字'}$('#send').onclick=()=>{if(!$('#email').value.trim()){ $('#authmsg').textContent='メールアドレスを入力してください。';return }$('#otpbox').classList.remove('hidden');$('#authmsg').textContent='デモ認証コードは 123456 です。'};$('#verify').onclick=()=>{if($('#otp').value.trim()!=='123456'){ $('#authmsg').textContent='認証コードを確認してください。';return }$('#auth').classList.add('hidden');$('#editor').classList.remove('hidden');fill();if(!$('#date').value)$('#date').value=new Date().toISOString().slice(0,10)};['date','soku','bunku','honbu','shibu','category','name','title','body'].forEach(id=>{$('#'+id).addEventListener('input',()=>{counts();saveLocal(false)});$('#'+id).addEventListener('change',()=>saveLocal(false))});$('#save').onclick=()=>saveLocal(true);$('#submit').onclick=()=>{const d=vals();if(!d.name||!d.title||!d.body){msg('氏名・題名・本文を入力してください。','warn');return}if([...d.title].length>40){msg('題名は40字以内にしてください。','warn');return}if(!$('#confirm').checked){msg('掲載内容の確認にチェックしてください。','warn');return}d.status='submitted';localStorage.setItem(key,JSON.stringify(d));msg('デモ提出が完了しました。本番接続後はクラウドへ保存されます。','ok')};setInterval(()=>{if(!$('#editor').classList.contains('hidden'))saveLocal(false)},20000);</script></body></html>
