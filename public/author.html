<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061226"><title>WRITE YOUR STORY | ROAD TO PEACE PRIDE</title><style>:root{--n:#061226;--g:#d8b866;--g2:#efd98d;--m:#aeb5c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#061226;color:#fff;font-family:ui-sans-serif,system-ui,"Yu Gothic",sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 15%,rgba(232,199,112,.24),transparent 14%),linear-gradient(180deg,#181b46,#0c1631 44%,#061226 78%)}body:after{content:"";position:fixed;left:50%;bottom:-12vh;z-index:-2;width:35vw;min-width:190px;height:86vh;transform:translateX(-50%) perspective(500px) rotateX(68deg);transform-origin:bottom;background:linear-gradient(180deg,transparent,rgba(242,194,70,.22));filter:blur(10px);clip-path:polygon(45% 0,55% 0,96% 100%,4% 100%)}.wrap{width:min(100%,680px);margin:auto;padding:22px 14px 84px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-family:ui-serif,"Yu Mincho",serif;letter-spacing:.11em}.pill,.btn{border:1px solid rgba(216,184,102,.45);border-radius:999px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;padding:10px 15px;cursor:pointer}.panel{border:1px solid rgba(216,184,102,.32);background:rgba(6,18,38,.78);backdrop-filter:blur(12px);padding:22px 18px;margin-bottom:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.ey{color:var(--g2);font-size:10px;font-weight:800;letter-spacing:.24em}.panel h1{font-family:ui-serif,"Yu Mincho",serif;font-weight:500;letter-spacing:.06em;margin:10px 0 8px}.note{font-size:12px;line-height:1.7;color:var(--m)}.field{margin:14px 0}label{display:block;font-size:12px;color:#e9dfc1;margin:0 0 6px}input,select,textarea{width:100%;border:1px solid rgba(216,184,102,.35);border-radius:9px;background:rgba(255,255,255,.055);color:#fff;padding:12px 13px;font-size:15px;outline:none}textarea{min-height:260px;resize:vertical;line-height:1.8}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(216,184,102,.1)}select option{color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.count{text-align:right;font-size:11px;color:var(--m);margin-top:5px}.stack{display:grid;gap:9px}.primary{background:linear-gradient(135deg,#b88e3c,#efd98d);color:#1b1305;font-weight:800;border:0;width:100%;min-height:48px}.secondary{width:100%;min-height:46px}.status{padding:10px 12px;border:1px solid rgba(216,184,102,.25);background:rgba(255,255,255,.03);font-size:12px;line-height:1.7}.hidden{display:none!important}.ok{color:#a9e2bb}.warn{color:#f3c0a9}.preview{position:fixed;left:0;right:0;bottom:0;background:#efd98d;color:#221706;font-size:11px;font-weight:800;text-align:center;padding:8px;z-index:20}.photo-preview{width:min(100%,320px);max-height:280px;object-fit:cover;border:1px solid rgba(216,184,102,.5);margin-top:10px}.save-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{border:1px solid rgba(216,184,102,.35);border-radius:999px;padding:5px 9px;color:var(--g2);font-size:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">WRITE YOUR STORY</div><a class="pill" href="./index.html">公開ブック</a></div>
<section id="auth" class="panel"><div class="ey">AUTHOR ACCESS</div><h1>あなたの原稿を書く</h1><p class="note">Googleアカウントは不要です。メールに届く6桁コードで本人確認します。この端末ではログイン状態を保持します。</p><div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="example@email.com"></div><button id="send" class="btn primary">認証コードを送信</button><div id="otpbox" class="hidden"><div class="field"><label>6桁認証コード</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6桁コード"></div><button id="verify" class="btn primary">認証する</button></div><div id="authmsg" class="note"></div></section>
<section id="editor" class="hidden"><div class="panel"><div class="save-row"><div><div class="ey">MY STORY</div><h1>原稿の入力・編集</h1></div><span id="statusBadge" class="badge">下書き</span></div><div class="status"><b>DUAL SAVE</b><br><span id="saveState">この端末＋Cloudflareへ自動保存します。</span></div><div class="field"><label>記載日付</label><input id="record_date" type="date"></div><div class="grid"><div class="field"><label>総区</label><input id="soku" placeholder="〇〇総区"></div><div class="field"><label>分区</label><input id="bunku" placeholder="〇〇分区"></div><div class="field"><label>本部</label><input id="honbu" placeholder="〇〇本部"></div><div class="field"><label>支部</label><input id="shibu" placeholder="〇〇支部"></div></div><div class="field"><label>カテゴリー</label><select id="category"><option>体験談</option><option>活動報告</option><option>決意</option><option>その他</option></select></div><div class="field"><label>氏名</label><input id="name" autocomplete="name" placeholder="氏名"></div><div class="field"><label>題名（40字以内）</label><input id="title" maxlength="40" placeholder="題名"><div id="titleCount" class="count">0 / 40</div></div><div class="field"><label>本文（1000字程度）</label><textarea id="body" placeholder="原文をそのまま入力してください。AIによる自動校正・要約・言い換えは行いません。"></textarea><div id="bodyCount" class="count">0字</div></div><div class="field"><label>写真（1枚）</label><input id="photo" type="file" accept="image/*"><img id="photoPreview" class="photo-preview hidden" alt="選択した写真"><div class="note">アップロード前に最大1600pxへ圧縮し、JPEG再生成で通常の位置情報等のメタデータを除去します。</div></div><label style="display:flex;gap:8px;align-items:flex-start;margin:18px 0"><input id="confirm" type="checkbox" style="width:auto;margin-top:3px"><span class="note">掲載内容と写真を確認しました</span></label><div class="stack"><button id="save" class="btn secondary">下書き保存</button><button id="submit" class="btn primary">提出する</button><button id="logout" class="btn secondary">この端末からログアウト</button></div><div id="savemsg" class="note"></div></div></section></div><div id="previewBar" class="preview hidden">PREVIEW MODE｜メール送信未設定時のみ画面に認証コードを表示します。</div>
<script>const $=s=>document.querySelector(s);let email='',serverTimer=null;const ids=['record_date','soku','bunku','honbu','shibu','category','name','title','body'];const localKey=()=>`rpp_draft_${email||$('#email').value.trim().toLowerCase()||'unknown'}`;
function setMsg(t,c=''){const e=$('#savemsg');e.textContent=t;e.className='note '+c}function data(status){return{record_date:$('#record_date').value,soku:$('#soku').value,bunku:$('#bunku').value,honbu:$('#honbu').value,shibu:$('#shibu').value,category:$('#category').value,name:$('#name').value,title:$('#title').value,body:$('#body').value,status}}
function counts(){$('#titleCount').textContent=[...$('#title').value].length+' / 40';$('#bodyCount').textContent=[...$('#body').value].length+'字'}function saveLocal(){try{localStorage.setItem(localKey(),JSON.stringify({...data($('#statusBadge').textContent==='提出済'?'submitted':'draft'),saved_at:new Date().toISOString()}))}catch{}}
function fill(s){if(!s)return;ids.forEach(id=>{if(s[id]!=null)$('#'+id).value=s[id]});$('#statusBadge').textContent=s.status==='submitted'?'提出済':'下書き';counts()}
async function health(){try{const d=await (await fetch('/api/health')).json();if(d.preview)$('#previewBar').classList.remove('hidden')}catch{}}
async function openEditor(){const r=await fetch('/api/me/story',{credentials:'same-origin'});if(!r.ok)return false;const d=await r.json();email=d.email||email;$('#auth').classList.add('hidden');$('#editor').classList.remove('hidden');if(d.story)fill(d.story);else{try{fill(JSON.parse(localStorage.getItem(localKey())||'null'))}catch{}if(!$('#record_date').value)$('#record_date').value=new Date().toISOString().slice(0,10)}startAutosave();return true}
$('#send').onclick=async()=>{email=$('#email').value.trim().toLowerCase();if(!email){$('#authmsg').textContent='メールアドレスを入力してください。';return}$('#send').disabled=true;const r=await fetch('/api/auth/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();$('#send').disabled=false;if(!r.ok){$('#authmsg').textContent=d.error||'送信できませんでした。';return}$('#otpbox').classList.remove('hidden');$('#authmsg').textContent=d.previewCode?`公開確認用コード：${d.previewCode}`:'6桁の認証コードをメールに送りました。'};
$('#verify').onclick=async()=>{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email||$('#email').value.trim().toLowerCase(),code:$('#otp').value.trim()})});const d=await r.json();if(!r.ok){$('#authmsg').textContent=d.error||'認証できませんでした。';return}email=d.email;await openEditor()};
async function saveServer(status,silent=false){saveLocal();$('#saveState').textContent='クラウドへ保存中…';const r=await fetch('/api/me/story',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data(status))});const d=await r.json();if(!r.ok){$('#saveState').textContent='クラウド保存エラー';if(!silent)setMsg(d.error||'保存できませんでした。','warn');return false}fill(d.story);$('#saveState').textContent='端末＋Cloudflareに保存済';if(!silent)setMsg(status==='submitted'?'提出しました。締切までは再編集できます。':'下書きを保存しました。','ok');return true}
function startAutosave(){clearInterval(serverTimer);serverTimer=setInterval(()=>{if($('#editor').classList.contains('hidden'))return;const d=data('draft');if(d.name||d.title||d.body)saveServer($('#statusBadge').textContent==='提出済'?'submitted':'draft',true)},20000)}
ids.forEach(id=>{$('#'+id).addEventListener('input',()=>{counts();saveLocal()});$('#'+id).addEventListener('change',saveLocal)});$('#save').onclick=()=>saveServer('draft');$('#submit').onclick=()=>{const d=data('submitted');if(!d.name||!d.title||!d.body){setMsg('氏名・題名・本文を入力してください。','warn');return}if([...d.title].length>40){setMsg('題名は40字以内にしてください。','warn');return}if(!$('#confirm').checked){setMsg('掲載内容の確認にチェックしてください。','warn');return}saveServer('submitted')};
async function compress(file){const bmp=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像処理失敗')),'image/jpeg',.82))}
$('#photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const blob=await compress(f),url=URL.createObjectURL(blob);$('#photoPreview').src=url;$('#photoPreview').classList.remove('hidden');setMsg('写真を保存中…');const r=await fetch('/api/me/photo',{method:'POST',headers:{'Content-Type':'image/jpeg'},credentials:'same-origin',body:blob});const d=await r.json();setMsg(r.ok?'写真を保存しました。':(d.error||'写真を保存できませんでした。'),r.ok?'ok':'warn')}catch(e){setMsg('写真を処理できませんでした。','warn')}};
$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.reload()};window.addEventListener('beforeunload',saveLocal);health();openEditor();</script></body></html>
