<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>ROAD TO PEACE PRIDE | MEMORIAL COLLECTION 2026</title>
<style>
:root{--navy:#061226;--gold:#d8b866;--gold2:#f0d98c;--paper:#f5efdf;--ink:#17140f;--muted:#aeb5c5;--body-size:16px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#fff;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;background:#061226;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 18%,rgba(232,199,112,.28),transparent 13%),radial-gradient(ellipse at 50% 78%,rgba(190,144,53,.18),transparent 14%),linear-gradient(180deg,#151a42 0%,#0c1631 42%,#071225 68%,#050d1a 100%)}body:after{content:"";position:fixed;left:50%;bottom:-14vh;z-index:-2;width:38vw;min-width:210px;height:88vh;transform:translateX(-50%) perspective(500px) rotateX(68deg);transform-origin:bottom;background:linear-gradient(180deg,rgba(255,229,151,0),rgba(244,205,104,.08) 30%,rgba(242,194,70,.27) 100%);filter:blur(8px);clip-path:polygon(44% 0,56% 0,95% 100%,5% 100%)}.horizon{position:fixed;z-index:-1;left:0;right:0;top:62vh;height:1px;background:linear-gradient(90deg,transparent,rgba(241,211,133,.42),transparent);box-shadow:0 0 24px rgba(241,211,133,.22)}.hidden{display:none!important}.wrap{width:min(100%,760px);margin:auto;min-height:100vh}.gate,.cover,.toc,.reader{min-height:100vh;padding:26px 20px 76px}.orn{border:1px solid rgba(216,184,102,.38);box-shadow:inset 0 0 0 5px rgba(216,184,102,.035);position:relative}.orn:before,.orn:after{content:"✦";position:absolute;color:var(--gold)}.orn:before{left:10px;top:8px}.orn:after{right:10px;bottom:8px}.eyebrow{font:700 10px/1.4 ui-sans-serif,system-ui;letter-spacing:.25em;color:var(--gold2)}.gate{display:grid;place-items:center}.gate-card{width:100%;max-width:430px;padding:40px 24px;text-align:center;background:rgba(6,18,38,.78);backdrop-filter:blur(14px)}h1{font-size:clamp(30px,8vw,52px);line-height:1.25;font-weight:500;letter-spacing:.05em;margin:18px 0 8px}.sub{color:#d8dce7;line-height:1.9;font-size:13px}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0}.input{width:100%;border:1px solid rgba(216,184,102,.45);background:rgba(255,255,255,.055);color:#fff;border-radius:10px;padding:14px 15px;font-size:16px;outline:none}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border-radius:999px;border:1px solid rgba(216,184,102,.5);text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,#b68b36,#efd987);color:#1b1305;font-weight:700;width:100%;margin-top:12px}.ghost{background:rgba(255,255,255,.04);color:#f5e8bd}.note{font:12px/1.7 ui-sans-serif,system-ui;color:var(--muted)}#msg{min-height:23px;color:#f1bdac;margin-top:8px}.cover{display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(6,18,38,.16),rgba(6,18,38,.42))}.cover h1{font-size:clamp(36px,10vw,68px)}.jp{font-size:18px;line-height:1.8}.bridge{font-size:13px;color:var(--gold2);margin:10px 0 30px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.toc h2,.reader h2{font-weight:500}.toc-item{border-top:1px solid rgba(216,184,102,.22)}.toc-item:last-child{border-bottom:1px solid rgba(216,184,102,.22)}.toc-item button{width:100%;display:flex;justify-content:space-between;text-align:left;background:none;border:0;color:#fff;padding:18px 4px;cursor:pointer}.toc-title{font-size:17px;margin-bottom:5px}.toc-name{font:12px ui-sans-serif,system-ui;color:#bbc1cf}.paper{background:rgba(245,239,223,.97);color:var(--ink);min-height:75vh;padding:32px 23px 38px;border:1px solid #ceb46c;box-shadow:0 20px 70px rgba(0,0,0,.42)}.story-label{text-align:center;color:#8e6b24;font:700 10px ui-sans-serif,system-ui;letter-spacing:.2em}.paper h2{text-align:center;font-size:28px;line-height:1.5;margin:18px 0 8px}.meta{text-align:center;color:#655e52;font-size:12px;line-height:1.8}.photo{width:min(78%,360px);max-height:360px;object-fit:cover;display:block;margin:20px auto;border:1px solid #b79954}.body{white-space:pre-wrap;font-size:var(--body-size);line-height:2.05;margin-top:24px}.reader-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.reader-nav button,.mini-btn{border:1px solid rgba(216,184,102,.4);background:rgba(255,255,255,.04);color:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.top-actions{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -5px 18px;padding:8px 5px;background:linear-gradient(180deg,rgba(6,18,38,.98),rgba(6,18,38,.86),transparent)}.reader-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.tiny{font:11px ui-sans-serif,system-ui;color:var(--muted)}.preview{position:fixed;left:0;right:0;bottom:0;background:#efd98d;color:#221706;font:700 11px/1.35 ui-sans-serif,system-ui;text-align:center;padding:8px;z-index:99}.resume-note{font:12px/1.7 ui-sans-serif,system-ui;color:#d8dce7;margin-top:10px}@media(max-width:520px){.paper{padding:27px 18px}.gate,.cover,.toc,.reader{padding-left:14px;padding-right:14px}.reader-tools .tiny{display:none}.reader-nav button{padding:9px 10px}}
</style></head>
<body><div class="horizon"></div><div class="wrap">
<section id="gate" class="gate"><div class="gate-card orn"><div class="eyebrow">MEMORIAL COLLECTION 2026</div><h1>ROAD TO<br>PEACE PRIDE</h1><p class="sub">9.12までの挑戦と誓いの記録<br>OUR VOW, OUR JOURNEY</p><div class="rule"></div><input id="pw" class="input" type="password" autocomplete="current-password" placeholder="閲覧パスワード"><button id="unlock" class="btn primary">文集をひらく</button><div id="msg" class="note"></div><p id="demoHint" class="note hidden">公開確認用パスワード：demo</p></div></section>
<section id="cover" class="cover hidden orn"><div class="eyebrow">MEMORIAL COLLECTION 2026</div><h1>ROAD TO<br>PEACE PRIDE</h1><div class="jp">9.12までの挑戦と誓いの記録</div><div class="bridge">そして、11.15、11.18へ</div><div class="rule"></div><div class="eyebrow">OUR VOW, OUR JOURNEY</div><div class="actions" style="margin-top:34px"><button id="tocBtn" class="btn ghost">CONTENTS｜目次</button><button id="resumeBtn" class="btn ghost hidden">続きから読む</button><a class="btn ghost" href="./author.html">WRITE YOUR STORY｜原稿を書く</a></div><div id="resumeNote" class="resume-note hidden"></div></section>
<section id="toc" class="toc hidden"><div class="top-actions"><button class="btn ghost" id="homeBtn">← 表紙</button><span class="eyebrow">CONTENTS</span></div><h2>目次</h2><p class="note">題名と氏名のみを掲載します。</p><div id="tocList"></div></section>
<section id="reader" class="reader hidden"><div class="top-actions"><button class="mini-btn" id="backToc">目次</button><div class="reader-tools"><span id="count" class="tiny"></span><button class="mini-btn" id="fontDown" aria-label="文字を小さく">A−</button><button class="mini-btn" id="fontUp" aria-label="文字を大きく">A＋</button></div></div><article class="paper orn"><div class="story-label" id="storyNo"></div><h2 id="title"></h2><div class="meta" id="meta"></div><img id="photo" class="photo hidden" alt="投稿写真"><div class="rule"></div><div class="body" id="body"></div><div class="rule"></div><div class="story-label">原文のまま掲載</div></article><div class="reader-nav"><button id="prev">← 前</button><button id="fav">☆ お気に入り</button><button id="next">次 →</button></div></section>
</div><div id="previewBar" class="preview hidden">PREVIEW MODE｜現在は公開確認用デモです。</div>
<script>
const $=s=>document.querySelector(s);let stories=[],current=0;const LAST_KEY='rpp_last_story',FONT_KEY='rpp_font_size';
const show=id=>{['gate','cover','toc','reader'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));scrollTo(0,0)};
function loadFont(){const n=Math.max(14,Math.min(22,Number(localStorage.getItem(FONT_KEY)||16)));document.documentElement.style.setProperty('--body-size',`${n}px`);return n}
function setFont(delta){const now=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--body-size'))||16,n=Math.max(14,Math.min(22,now+delta));document.documentElement.style.setProperty('--body-size',`${n}px`);localStorage.setItem(FONT_KEY,String(n))}
async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();if(d.preview){$('#previewBar').classList.remove('hidden');if(!d.viewerPasswordConfigured)$('#demoHint').classList.remove('hidden')}}catch{}}
async function loadStories(){const r=await fetch('/api/stories',{credentials:'same-origin',cache:'no-store'});if(r.status===401)return false;const d=await r.json();if(!r.ok)throw new Error(d.error||'読み込みに失敗しました。');stories=d.stories||[];updateResume();return true}
function updateResume(){const id=localStorage.getItem(LAST_KEY),i=stories.findIndex(s=>s.id===id);if(i>=0){$('#resumeBtn').classList.remove('hidden');$('#resumeNote').classList.remove('hidden');$('#resumeNote').textContent=`前回：${stories[i].title||'無題'} ／ ${stories[i].name||''}`;$('#resumeBtn').onclick=()=>openStory(i)}else{$('#resumeBtn').classList.add('hidden');$('#resumeNote').classList.add('hidden')}}
async function resumeSession(){try{if(await loadStories())show('cover')}catch{}}
$('#unlock').onclick=async()=>{const r=await fetch('/api/viewer/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:$('#pw').value})});const d=await r.json();if(!r.ok){$('#msg').textContent=d.error||'パスワードを確認してください。';return}await loadStories();show('cover')};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#unlock').click()});
function renderToc(){const el=$('#tocList');el.textContent='';stories.forEach((s,i)=>{const d=document.createElement('div');d.className='toc-item';const b=document.createElement('button'),left=document.createElement('div'),t=document.createElement('div'),n=document.createElement('div'),arrow=document.createElement('div');t.className='toc-title';n.className='toc-name';t.textContent=s.title||'無題';n.textContent=s.name||'';arrow.textContent='›';left.append(t,n);b.append(left,arrow);b.onclick=()=>openStory(i);d.append(b);el.append(d)});if(!stories.length){const p=document.createElement('p');p.className='note';p.textContent='公開済みの原稿はまだありません。';el.append(p)}}
function openStory(i){current=i;renderStory();show('reader')}
function renderStory(){const s=stories[current];if(!s)return;localStorage.setItem(LAST_KEY,s.id||'');$('#storyNo').textContent=`STORY ${String(current+1).padStart(2,'0')}`;$('#title').textContent=s.title||'';const meta=$('#meta');meta.textContent='';const vals=[s.name,s.org,s.record_date].filter(Boolean);vals.forEach((v,j)=>{meta.append(document.createTextNode(v));if(j<vals.length-1)meta.append(document.createElement('br'))});$('#body').textContent=s.body||'';$('#count').textContent=`${current+1} / ${stories.length}`;const img=$('#photo');if(s.photo_url){img.src=s.photo_url;img.classList.remove('hidden')}else{img.removeAttribute('src');img.classList.add('hidden')}let fav=[];try{fav=JSON.parse(localStorage.getItem('rpp_fav')||'[]')}catch{};$('#fav').textContent=fav.includes(s.id)?'★ 保存済':'☆ お気に入り';updateResume()}
$('#tocBtn').onclick=()=>{renderToc();show('toc')};$('#homeBtn').onclick=()=>show('cover');$('#backToc').onclick=()=>{renderToc();show('toc')};$('#next').onclick=()=>{if(stories.length){current=(current+1)%stories.length;renderStory();scrollTo(0,0)}};$('#prev').onclick=()=>{if(stories.length){current=(current-1+stories.length)%stories.length;renderStory();scrollTo(0,0)}};$('#fav').onclick=()=>{if(!stories[current])return;let f=[];try{f=JSON.parse(localStorage.getItem('rpp_fav')||'[]')}catch{};const id=stories[current].id;f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.setItem('rpp_fav',JSON.stringify(f));renderStory()};$('#fontDown').onclick=()=>setFont(-1);$('#fontUp').onclick=()=>setFont(1);
document.addEventListener('keydown',e=>{if(!$('#reader').classList.contains('hidden')){if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()}});let sx=0,sy=0;$('#reader').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('#reader').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.2)(dx<0?$('#next'):$('#prev')).click()},{passive:true});loadFont();health();resumeSession();
</script></body></html>
