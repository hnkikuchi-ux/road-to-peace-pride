<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f3d66"><title>試用メンバーを追加｜議員ホーム</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f5f8fc}.setup-wrap{max-width:680px;margin:0 auto;padding:24px 14px 60px}.setup-card{background:#fff;border:1px solid #dfe8f0;border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(28,54,83,.1)}.setup-card h1{font-size:28px;color:#17324a}.setup-card label{display:block;margin:16px 0 6px;font-weight:800}.setup-card input{width:100%}.result{margin-top:20px;padding:18px;background:#eef8f2;border-radius:18px}.result code{display:block;overflow-wrap:anywhere;margin:8px 0;padding:10px;background:#fff;border-radius:10px}.result .button{width:100%;margin-top:10px}</style></head>
<body><main class="setup-wrap"><div class="setup-card"><span class="step-label">管理者用</span><h1>試用メンバーを追加</h1><p>議員ごとの公開URLと、本人だけが使う管理キーを発行します。</p><label for="setupKey">管理者用セットアップキー</label><input id="setupKey" type="password" autocomplete="off"><label for="name">議員名</label><input id="name" type="text" placeholder="山田 はなこ"><label for="town">自治体名</label><input id="town" type="text" placeholder="〇〇町"><label for="office">肩書</label><input id="office" type="text" placeholder="〇〇町議会議員"><label for="slug">公開URL名（半角英数字とハイフン）</label><input id="slug" type="text" inputmode="url" autocapitalize="none" placeholder="yamada-hanako"><button id="createButton" class="button primary large" type="button">個別URLを発行</button><div id="result" class="result hidden"></div></div></main>
<script>
const $=id=>document.getElementById(id);let created=null;
$('createButton').addEventListener('click',async()=>{const button=$('createButton');button.disabled=true;button.textContent='発行中…';try{const response=await fetch('/api/setup/member',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Key':$('setupKey').value},body:JSON.stringify({name:$('name').value,town:$('town').value,office:$('office').value,slug:$('slug').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'発行できませんでした');created=data;$('result').classList.remove('hidden');$('result').innerHTML=`<strong>発行しました</strong><p>公開URL</p><code>${data.publicUrl}</code><p>本人用の管理URL</p><code>${data.adminUrl}</code><p>管理キー（再表示できません）</p><code>${data.manageKey}</code><button class="button secondary" id="copyAll">3点をまとめてコピー</button><button class="button primary" id="openAdmin">本人用画面を開く</button>`;$('copyAll').onclick=()=>navigator.clipboard.writeText(`公開URL：${data.publicUrl}\n管理URL：${data.adminUrl}\n管理キー：${data.manageKey}`);$('openAdmin').onclick=()=>location.href=data.adminUrl;}catch(e){alert(e.message)}finally{button.disabled=false;button.textContent='個別URLを発行'}});
</script></body></html>
