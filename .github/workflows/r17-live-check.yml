name: Verify r17 live deployment

on:
  push:
    branches: [main]
    paths:
      - 'src/faithful-cover-v11-r17.js'
      - 'wrangler.jsonc'
      - 'public/version.json'
      - '.github/workflows/r17-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for r17 version
        env:
          BASE: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: |
          for i in $(seq 1 36); do
            echo "check $i"
            if curl -fsS --max-time 8 "$BASE/version.json?r17=${GITHUB_RUN_ID}-$i" | grep -Fq '2026.09.07-faithful-v11-r17-brevo-save-gate'; then
              echo 'r17 version is live'
              exit 0
            fi
            sleep 10
          done
          echo 'r17 version did not become live in time'
          exit 1
      - name: Verify admin r17 injection
        env:
          BASE: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: |
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$BASE/admin.html?r17=${GITHUB_RUN_ID}" > /tmp/admin.html
          grep -Fq 'MAIL FIX r17' /tmp/admin.html
          grep -Fq 'saveAndVerify' /tmp/admin.html
          echo 'r17 admin capture patch is live'
      - name: Verify public health
        env:
          BASE: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: |
          curl -fsS --max-time 15 "$BASE/api/health?r17=${GITHUB_RUN_ID}" | python3 -m json.tool
