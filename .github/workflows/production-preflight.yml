name: Production launch preflight

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check live production prerequisites
        run: |
          set -euo pipefail
          BASE='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          for i in $(seq 1 36); do
            curl -fsS "$BASE/api/health?launch=${GITHUB_RUN_ID}-$i" -o health.json
            if python3 - <<'PY'
          import json,sys
          x=json.load(open('health.json'))
          sys.exit(0 if 'emailConfigured' in x else 1)
          PY
            then break; fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          h=json.load(open('health.json'))
          checks={
            'health': h.get('ok') is True,
            'production mode': h.get('preview') is False,
            'photo storage': h.get('storageConfigured') is True,
            'viewer password configured': h.get('viewerPasswordConfigured') is True,
            'email OTP configured': h.get('emailConfigured') is True,
            'Brevo provider': h.get('emailProvider') == 'brevo',
            'free-plan compatible': h.get('freePlanCompatible') is True,
            'security guard v3': h.get('securityGuard') == 'v3',
            'book open': h.get('bookOpen') is True,
          }
          for k,v in checks.items():
              print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()):
              print(json.dumps(h,ensure_ascii=False,indent=2))
              raise SystemExit(1)
          print('PRODUCTION PREFLIGHT PASSED')
          PY
