name: Production launch preflight

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check live production prerequisites
        run: |
          set -euo pipefail
          BASE='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          curl -fsS "$BASE/api/health?launch=${GITHUB_RUN_ID}" -o health.json
          curl -fsS "$BASE/api/config?launch=${GITHUB_RUN_ID}" -o config.json
          python3 - <<'PY'
          import json
          h=json.load(open('health.json'))
          c=json.load(open('config.json'))
          checks={
            'health': h.get('ok') is True,
            'photo storage': h.get('storageConfigured') is True,
            'email OTP configured': c.get('emailConfigured') is True,
            'book open': c.get('bookOpen') is True,
          }
          for k,v in checks.items():
              print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()):
              print('health=',json.dumps(h,ensure_ascii=False))
              print('config=',json.dumps(c,ensure_ascii=False))
              raise SystemExit(1)
          print('PRODUCTION PREFLIGHT PASSED')
          PY
