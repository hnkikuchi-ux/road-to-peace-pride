name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/faithful-cover-v11-r33.js
          node --check src/faithful-cover-v11-r32.js
          node --check src/faithful-cover-v11-r31.js
          node --check src/faithful-cover-v11-r30.js
          node --check src/faithful-cover-v11-r29.js
          node --check src/faithful-cover-v11-r28.js
          node --check src/faithful-cover-v11-r27.js
          node --check src/faithful-cover-v11-r26.js
          node --check src/faithful-cover-v11-r25.js
          node --check src/faithful-cover-v11-r19.js
          node --check src/faithful-cover-v11-r17.js
          node --check src/faithful-cover-v11-r15.js
          node --check src/faithful-cover-v11-r14.js
          node --check src/faithful-cover-v11-r13.js
          node --check src/faithful-cover-v11-r12.js
          node --check src/faithful-cover-v11-r11.js
          node --check src/faithful-cover-v11-r10.js
          python -m py_compile scripts/cache_refresh_smoke.py scripts/faithful_v11_smoke.py scripts/logout_smoke.py scripts/full_product_qa.py scripts/full_product_qa_r26.py scripts/scale_300_regression.py scripts/mobile_browser_smoke.py scripts/production_300_read_burst.py
      - name: Verify r31 first-time author guide
        run: |
          grep -Fq "import app from './faithful-cover-v11-r30.js'" src/faithful-cover-v11-r31.js
          grep -Fq "data-rpp-first-time-guide','r31-markup-fixed'" src/faithful-cover-v11-r31.js
          grep -Fq '#rppFirstTimeGuide{' src/faithful-cover-v11-r31.js
          grep -Fq 'id="rppFirstTimeGuide"' public/author.html
          grep -Fq '初めての方' public/author.html
          grep -Fq 'メールアドレスを入力し、「認識コードを送信」を押してください。' public/author.html
          ! grep -Fq 'MutationObserver' src/faithful-cover-v11-r31.js
      - name: Verify r30 author polish
        run: |
          grep -Fq "import app from './faithful-cover-v11-r29.js'" src/faithful-cover-v11-r30.js
          grep -Fq "data-rpp-author-polish','r30'" src/faithful-cover-v11-r30.js
          grep -Fq "変更内容を再提出する" src/faithful-cover-v11-r30.js
          grep -Fq "変更内容を保存" src/faithful-cover-v11-r30.js
          grep -Fq "#editor label" src/faithful-cover-v11-r30.js
      - name: Verify r29 saved-edit and resubmit guard
        run: |
          grep -Fq "import app from './faithful-cover-v11-r28.js'" src/faithful-cover-v11-r29.js
          grep -Fq 'rpp_story_working_drafts' src/faithful-cover-v11-r29.js
          grep -Fq 'X-RPP-Story-Intent' src/faithful-cover-v11-r29.js
          grep -Fq "storyIntent='edit-draft'" src/faithful-cover-v11-r29.js
          grep -Fq "storyIntent='submit'" src/faithful-cover-v11-r29.js
          grep -Fq "save.textContent='変更内容を保存'" src/faithful-cover-v11-r29.js
          grep -Fq "再提出するまでは掲載内容は変わりません" src/faithful-cover-v11-r29.js
          ! grep -Fq '原文のまま掲載' src/faithful-cover-v11-r29.js
          grep -Fq "data-rpp-submission-guard','r29'" src/faithful-cover-v11-r29.js
      - name: Verify r28 logged-out re-edit fix
        run: |
          grep -Fq "import app from './faithful-cover-v11-r27.js'" src/faithful-cover-v11-r28.js
          grep -Fq 'rppEditEmail' src/faithful-cover-v11-r28.js
          grep -Fq '/api/edit-code/login' src/faithful-cover-v11-r28.js
          grep -Fq "typeof openEditor!=='function'" src/faithful-cover-v11-r28.js
          grep -Fq "data-rpp-reedit-fix','r28'" src/faithful-cover-v11-r28.js
      - name: Verify r27 no-reload re-edit flow
        run: |
          grep -Fq "import app from './faithful-cover-v11-r26.js'" src/faithful-cover-v11-r27.js
          grep -Fq "data-rpp-reedit','r27'" src/faithful-cover-v11-r27.js
          grep -Fq "typeof openEditor==='function'" src/faithful-cover-v11-r27.js
          grep -Fq "await openEditor()" src/faithful-cover-v11-r27.js
          ! grep -Fq "location.reload()" src/faithful-cover-v11-r27.js
      - name: Verify r26 auth schema hotfix
        run: |
          grep -Fq "import uiApp from './faithful-cover-v11-r25.js'" src/faithful-cover-v11-r26.js
          grep -Fq "import baseApp from './faithful-cover-v11-r19.js'" src/faithful-cover-v11-r26.js
          grep -Fq "DB.prepare('CREATE TABLE IF NOT EXISTS rpp_edit_codes" src/faithful-cover-v11-r26.js
          grep -Fq "DB.prepare('CREATE TABLE IF NOT EXISTS rpp_author_resets" src/faithful-cover-v11-r26.js
          grep -Fq 'storeOtpAsEditCode' src/faithful-cover-v11-r26.js
          grep -Fq 'data.editCodeSameAsOtp=true' src/faithful-cover-v11-r26.js
          grep -Fq '/api/admin/author-reset' src/faithful-cover-v11-r26.js
      - name: Verify r25 mobile UI and periodic meteors
        run: |
          grep -Fq 'data-rpp-mobile-compat' src/faithful-cover-v11-r25.js
          grep -Fq 'rpp-line' src/faithful-cover-v11-r25.js
          grep -Fq 'touch-action:manipulation' src/faithful-cover-v11-r25.js
          grep -Fq 'font-size:16px!important' src/faithful-cover-v11-r25.js
          grep -Fq '提出済みの原稿です。内容を変更して再提出できます。' src/faithful-cover-v11-r25.js
          grep -Fq '修正後、「変更内容を再提出する」を押すと、原稿が更新されます。' src/faithful-cover-v11-r25.js
          grep -Fq 'rppR25MeteorSky' src/faithful-cover-v11-r25.js
          grep -Fq 'prefers-reduced-motion:reduce' src/faithful-cover-v11-r25.js
          ! grep -Fq 'MutationObserver' src/faithful-cover-v11-r25.js
      - name: Verify existing safety and Brevo path
        run: |
          grep -Fq 'attempts>=8' src/faithful-cover-v11-r11.js
          grep -Fq 'rpp_story_revisions' src/faithful-cover-v11-r10.js
          grep -Fq 'email_delivery_verified_at' src/faithful-cover-v11-r15.js
          grep -Fq 'smtp/statistics/events' src/faithful-cover-v11-r15.js
          grep -Fq 'saveCurrentMailSettings' src/faithful-cover-v11-r16.js
      - name: Verify active build and routing
        run: |
          grep -Fq 'faithful-v11-r33-final-qa-20260910-3' public/version.json
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.main!=='src/faithful-cover-v11-r33.js') process.exit(1); if(c.send_email) process.exit(1); console.log('r33 active')"
      - name: Final author API lifecycle QA
        run: node scripts/final_api_qa.mjs
      - name: Cloudflare Worker dry-run
        run: timeout 45s npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare Actions secrets are not configured; skipping direct deployment.'
            exit 0
          fi
          npx wrangler deploy

  live-smoke:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current author build
        env:
          BASE: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: |
          for i in $(seq 1 36); do
            echo "check $i"
            if curl -fsSL --max-time 8 -H 'Cache-Control: no-cache' "$BASE/author.html?r33=${GITHUB_RUN_ID}-$i" | grep -Fq "data-rpp-first-time-guide=\"r31-markup-fixed\""; then
              echo 'current stable author guide is live'
              exit 0
            fi
            sleep 10
          done
          echo 'current stable author guide did not become live in time'
          exit 1
      - name: Verify author guide and production health
        env:
          BASE: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: |
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$BASE/author.html?r33=${GITHUB_RUN_ID}" -o /tmp/author.html
          grep -Fq '初めての方' /tmp/author.html
          grep -Fq 'メールアドレスを入力し、「認識コードを送信」を押してください。' /tmp/author.html
          grep -Fq 'r31-markup-fixed' /tmp/author.html
          grep -Fq '提出期限：2026年10月31日' /tmp/author.html
          curl -fsS --max-time 15 "$BASE/api/health?r33=${GITHUB_RUN_ID}" -o /tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          checks={
            'health':h.get('ok') is True,
            'production':h.get('preview') is False,
            'viewer password':h.get('viewerPasswordConfigured') is True,
            'email configured':h.get('emailConfigured') is True,
            'email delivered':h.get('emailDeliveryVerified') is True,
            'production ready':h.get('productionReady') is True,
            'book open':h.get('bookOpen') is True,
          }
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if not all(checks.values()):
            print(json.dumps(h,ensure_ascii=False,indent=2))
            raise SystemExit(1)
          PY

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Production mobile browser smoke
        env:
          RPP_BASE_URL: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: python -u scripts/mobile_browser_smoke.py

  production-300-read-burst:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Production 300-read burst
        env:
          RPP_BASE_URL: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: python -u scripts/production_300_read_burst.py
