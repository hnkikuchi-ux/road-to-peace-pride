name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/faithful-cover-v11-r9.js
          node --check src/faithful-cover-v11-r8.js
          node --check src/faithful-cover-v11-r7.js
          node --check src/faithful-cover-v11-r6.js
          node --check src/faithful-cover-v11-r5.js
          node --check src/faithful-cover-v11-r4.js
          node --check src/faithful-cover-v11-r3.js
          node --check src/faithful-cover-v11.js
          python -m py_compile scripts/cache_refresh_smoke.py scripts/faithful_v11_smoke.py scripts/logout_smoke.py scripts/ux_regression.py
      - name: Verify faithful v11 r9 wiring
        run: |
          grep -Fq "import app from './faithful-cover-v11-r8.js'" src/faithful-cover-v11-r9.js
          grep -Fq "faithful v11-r9" src/faithful-cover-v11-r9.js
          grep -Fq "Luxury accordion" scripts/ux_regression.py
          grep -Fq '2026.09.05-faithful-v11-r9-luxury-accordion' public/version.json
      - name: Verify Worker routing
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.main!=='src/faithful-cover-v11-r9.js') process.exit(1); console.log('faithful-v11 r9 luxury accordion route active')"
      - name: Optional Cloudflare Worker dry-run
        run: timeout 45s npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist || echo 'Wrangler network check skipped; static checks passed.'

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare when repository secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Cloudflare API token not configured; relying on existing Git integration.'; exit 0; fi
          timeout 120s npx --yes wrangler@4 deploy

  live-smoke:
    if: github.event_name == 'push'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - name: Wait for faithful v11 r9 public deployment
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 8 "$RPP_BASE_URL/version.json?v11r9=${GITHUB_RUN_ID}-$i" | grep -Fq '2026.09.05-faithful-v11-r9-luxury-accordion'; then exit 0; fi
            sleep 10
          done
          exit 1
      - run: bash scripts/smoke-live.sh

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - run: python scripts/cache_refresh_smoke.py
      - run: python scripts/faithful_v11_smoke.py
      - run: python scripts/logout_smoke.py
      - name: Exercise luxury accordion and author flow
        run: python scripts/ux_regression.py
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
