name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/faithful-cover-v11-r21.js
          node --check src/faithful-cover-v11-r20.js
          node --check src/faithful-cover-v11-r19.js
          node --check src/faithful-cover-v11-r17.js
          node --check src/faithful-cover-v11-r16.js
          node --check src/faithful-cover-v11-r15.js
          node --check src/faithful-cover-v11-r14.js
          node --check src/faithful-cover-v11-r13.js
          node --check src/faithful-cover-v11-r12.js
          node --check src/faithful-cover-v11-r11.js
          node --check src/faithful-cover-v11-r10.js
          node --check src/faithful-cover-v11-r5.js
      - name: Verify r21 author entry-first flow
        run: |
          grep -Fq "import app from './faithful-cover-v11-r20.js'" src/faithful-cover-v11-r21.js
          grep -Fq "rpp_allow_auto_editor_once" src/faithful-cover-v11-r21.js
          grep -Fq "ENTRY_SCREEN_FIRST" src/faithful-cover-v11-r21.js
          grep -Fq "rppAuthorEntry='r21'" src/faithful-cover-v11-r21.js
      - name: Verify r20 unified author code flow
        run: |
          grep -Fq 'storeOtpAsEditCode' src/faithful-cover-v11-r20.js
          grep -Fq 'data.editCodeSameAsOtp=true' src/faithful-cover-v11-r20.js
          grep -Fq 'メールで届いた6桁コードを保存してください' src/faithful-cover-v11-r20.js
          grep -Fq '#rppAuthorHero .rpp-author-title' src/faithful-cover-v11-r20.js
          grep -Fq '#rppAuthorHero .rpp-author-sub' src/faithful-cover-v11-r20.js
      - name: Verify existing safety and Brevo path
        run: |
          grep -Fq 'attempts>=8' src/faithful-cover-v11-r11.js
          grep -Fq 'rpp_story_revisions' src/faithful-cover-v11-r10.js
          grep -Fq 'email_delivery_verified_at' src/faithful-cover-v11-r15.js
          grep -Fq 'smtp/statistics/events' src/faithful-cover-v11-r15.js
          grep -Fq 'saveCurrentMailSettings' src/faithful-cover-v11-r16.js
      - name: Verify active build and routing
        run: |
          grep -Fq '2026.09.07-faithful-v11-r21-author-entry-first' public/version.json
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.main!=='src/faithful-cover-v11-r21.js') process.exit(1); if(c.send_email) process.exit(1); console.log('faithful-v11 r21 author entry-first active')"
      - name: Optional Cloudflare Worker dry-run
        run: timeout 45s npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist || echo 'Wrangler network check skipped; static checks passed.'

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare when repository secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Cloudflare API token not configured; relying on existing Git integration.'; exit 0; fi
          timeout 120s npx --yes wrangler@4 deploy

  live-smoke:
    if: github.event_name == 'push'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - name: Wait for faithful v11 r21 public deployment
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 8 "$RPP_BASE_URL/version.json?v11r21=${GITHUB_RUN_ID}-$i" | grep -Fq '2026.09.07-faithful-v11-r21-author-entry-first'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify author entry marker is live
        run: |
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r21=${GITHUB_RUN_ID}" | grep -Fq "rppAuthorEntry='r21'"
      - run: bash scripts/smoke-live.sh

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Production author entry browser smoke
        run: |
          timeout 90s python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          base=os.environ['RPP_BASE_URL']
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--lang=ja-JP');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,20)
          try:
              d.get(base+'/author.html?prod-browser-r21=1')
              w.until(EC.visibility_of_element_located((By.ID,'auth')))
              w.until(lambda x: x.execute_script("return document.documentElement.dataset.rppAuthorEntry")=='r21')
              assert d.find_element(By.ID,'email').is_displayed()
              assert d.execute_script('return document.documentElement.scrollWidth<=document.documentElement.clientWidth+2')
              d.save_screenshot('artifacts/screens/production-author-entry-r21.png')
              print('PRODUCTION R21 AUTHOR ENTRY SMOKE PASSED')
          finally:
              d.quit()
          PY
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-r21
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
