name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check src/rpp-worker.js
      - name: Validate organization JSON
        run: node -e "JSON.parse(require('fs').readFileSync('public/organization-master.json','utf8')); console.log('organization-master.json OK')"
      - name: Verify required public files
        run: |
          test -f public/index.html
          test -f public/author.html
          test -f public/admin.html
          test -f public/status.html
          test -f public/organization-master.json
          test -f public/version.json
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist
