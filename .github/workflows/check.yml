name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/rpp-worker.js
          node --check src/secure-worker.js
          node --check src/ui-enhancer.js
          node --check src/top-bg-enhancer.js
          node --check src/motion-enhancer.js
          node --check src/responsive-enhancer.js
          node --check src/touch-safety.js
          node --check public/zip-store.js
      - name: Verify required public files
        run: |
          test -f public/index.html
          test -f public/author.html
          test -f public/admin.html
          test -f public/status.html
          test -f public/version.json
          test -f public/zip-store.js
          test -f public/assets/top-cover.webp
          test -f scripts/smoke-live.sh
          test -f scripts/browser_smoke.py
          test -f scripts/ux_regression.py
      - name: Verify approved cover wiring
        run: |
          grep -Fq "url('/assets/top-cover.webp')" src/top-bg-enhancer.js
          grep -Fq 'border:0!important' src/top-bg-enhancer.js
          grep -Fq "aria-label','閲覧パスワード" src/top-bg-enhancer.js
      - name: Verify premium motion and responsive system
        run: |
          grep -Fq "import app from './top-bg-enhancer.js'" src/motion-enhancer.js
          grep -Fq "import app from './motion-enhancer.js'" src/responsive-enhancer.js
          grep -Fq "import app from './responsive-enhancer.js'" src/touch-safety.js
          grep -Fq '記録をひらく' src/motion-enhancer.js
          grep -Fq '私の記録を綴る' src/motion-enhancer.js
          grep -Fq 'rppRipple' src/motion-enhancer.js
          grep -Fq 'prefers-reduced-motion' src/motion-enhancer.js
          grep -Fq 'rpp-pressed' src/motion-enhancer.js
          grep -Fq 'editorial composition' src/responsive-enhancer.js
          grep -Fq '@media (min-width:900px)' src/responsive-enhancer.js
      - name: Verify admin has no third-party JavaScript
        run: |
          ! grep -Eiq '<script[^>]+src=["'\'']https?://' public/admin.html
          grep -Fq 'src="./zip-store.js"' public/admin.html
      - name: Exercise built-in ZIP writer
        run: |
          node -e "import('./public/zip-store.js').then(async()=>{const b=await globalThis.RppZip.makeZip([{name:'test.txt',data:'ok'}]);const u=new Uint8Array(await b.arrayBuffer());if(u[0]!==0x50||u[1]!==0x4b||u[2]!==0x03||u[3]!==0x04)process.exit(1);console.log('ZIP writer OK',u.length)})"
      - name: Verify security and UI enhancer routing
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.main!=='src/touch-safety.js') process.exit(1); for(const p of ['/', '/index.html', '/author', '/author.html', '/status']) if(!c.assets.run_worker_first.includes(p)) process.exit(1); console.log('responsive + motion + touch-safe wrapper active; security routes preserved')"
          grep -Fq "path==='/author'||path==='/author.html'" src/ui-enhancer.js
          grep -Fq '写真（任意・1枚まで）' src/ui-enhancer.js
          grep -Fq 'この端末に、クラウドより新しい下書きがあります' src/ui-enhancer.js
          grep -Fq '提出済みのまま' src/ui-enhancer.js
          grep -Fq '題名・氏名で検索' src/ui-enhancer.js
          grep -Fq 'pointer-events:none' src/touch-safety.js
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist

  live-smoke:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise deployed Cloudflare site end to end
        run: bash scripts/smoke-live.sh

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Exercise mobile UI in headless Chrome
        run: python scripts/browser_smoke.py
      - name: Exercise optional photo, TOC search, and submitted-safe save
        run: python scripts/ux_regression.py
      - name: Upload mobile visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-qa
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
