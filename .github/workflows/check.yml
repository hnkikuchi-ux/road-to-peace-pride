name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Verify required public files
        run: |
          test -f public/index.html
          test -f public/author.html
          test -f public/admin.html
          test -f public/status.html
          test -f public/organization-master.json
