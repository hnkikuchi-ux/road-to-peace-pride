name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/viewer-logout.js
          node --check src/cache-refresh.js
          node --check src/premium-v5.js
          node --check src/visual-final.js
          node --check src/ui-enhancer.js
          node --check src/touch-safety.js
          node --check public/zip-store.js
          python -m py_compile scripts/cache_refresh_smoke.py scripts/logout_smoke.py scripts/ux_regression.py
      - name: Verify premium v5 assets, cache refresh, and logout wiring
        run: |
          for f in bg input unlock author divider lock; do test -s "public/assets/premium-v5-${f}.webp"; done
          grep -Fq "import app from './cache-refresh.js'" src/viewer-logout.js
          grep -Fq '/api/viewer/logout' src/viewer-logout.js
          grep -Fq 'rpp-viewer-logout' src/viewer-logout.js
          grep -Fq '閲覧をログアウトしてトップへ戻る' src/viewer-logout.js
          grep -Fq "import app from './premium-v5.js'" src/cache-refresh.js
          grep -Fq "Clear-Site-Data" src/cache-refresh.js
          grep -Fq '"cache"' src/cache-refresh.js
          grep -Fq "'/refresh'" src/cache-refresh.js
          grep -Fq "'/latest'" src/cache-refresh.js
          grep -Fq 'premium-v5-parts' src/premium-v5.js
          grep -Fq '/assets/premium-v5-bg.webp' src/premium-v5.js
          grep -Fq '/assets/premium-v5-input.webp' src/premium-v5.js
          grep -Fq '/assets/premium-v5-unlock.webp' src/premium-v5.js
          grep -Fq '/assets/premium-v5-author.webp' src/premium-v5.js
          grep -Fq '/assets/premium-v5-divider.webp' src/premium-v5.js
          grep -Fq '/assets/premium-v5-lock.webp' src/premium-v5.js
      - name: Verify Worker routing
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.name!=='road-to-peace-pride') process.exit(1); if(c.main!=='src/viewer-logout.js') process.exit(1); for(const p of ['/', '/index.html', '/refresh', '/latest', '/author', '/author.html', '/status']) if(!c.assets.run_worker_first.includes(p)) process.exit(1); console.log('viewer-logout + cache-refresh + premium-v5 route active')"
      - name: Verify admin has no third-party JavaScript
        run: |
          ! grep -Eiq '<script[^>]+src=["'\'']https?://' public/admin.html
          grep -Fq 'src="./zip-store.js"' public/admin.html
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist

  live-smoke:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public URL
        run: |
          NEW='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          OLD='https://giin-home-cloud-pilot.hn-kikuchi.workers.dev'
          if curl -fsS --max-time 8 "$NEW/version.json?probe=${GITHUB_RUN_ID}" >/dev/null 2>&1; then BASE="$NEW"; else BASE="$OLD"; fi
          echo "RPP_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Testing public URL: $BASE"
      - name: Exercise deployed Cloudflare site end to end
        run: bash scripts/smoke-live.sh

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public URL
        run: |
          NEW='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          OLD='https://giin-home-cloud-pilot.hn-kikuchi.workers.dev'
          if curl -fsS --max-time 8 "$NEW/version.json?probe=${GITHUB_RUN_ID}" >/dev/null 2>&1; then BASE="$NEW"; else BASE="$OLD"; fi
          echo "RPP_BASE_URL=$BASE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Japanese fonts and Selenium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Verify cache refresh route shows premium v5
        run: python scripts/cache_refresh_smoke.py
      - name: Verify viewer logout button clears session
        run: python scripts/logout_smoke.py
      - name: Exercise TOC search and author save regression
        run: python scripts/ux_regression.py
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
