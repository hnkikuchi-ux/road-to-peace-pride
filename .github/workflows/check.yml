name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/faithful-cover-v11-r15.js
          node --check src/faithful-cover-v11-r14.js
          node --check src/faithful-cover-v11-r13.js
          node --check src/faithful-cover-v11-r12.js
          node --check src/faithful-cover-v11-r11.js
          node --check src/faithful-cover-v11-r10.js
          node --check src/faithful-cover-v11-r5.js
          python -m py_compile scripts/cache_refresh_smoke.py scripts/faithful_v11_smoke.py scripts/logout_smoke.py scripts/full_product_qa.py scripts/scale_300_regression.py
      - name: Verify viewer consent and public cleanup
        run: |
          grep -Fq "import app from './faithful-cover-v11-r13.js'" src/faithful-cover-v11-r14.js
          grep -Fq '閲覧にあたっての確認事項' src/faithful-cover-v11-r14.js
          grep -Fq '本企画参加者のみ' src/faithful-cover-v11-r14.js
          grep -Fq '外部共有' src/faithful-cover-v11-r14.js
          grep -Fq 'rpp_viewer_consent_v1' src/faithful-cover-v11-r14.js
          grep -Fq "on('#cover .bridge'" src/faithful-cover-v11-r13.js
          grep -Fq "on('#cover .actions'" src/faithful-cover-v11-r13.js
          grep -Fq "on('#toc .top-actions .eyebrow'" src/faithful-cover-v11-r13.js
          grep -Fq '2026.09.06-faithful-v11-r15.4-brevo-free' public/version.json
      - name: Verify simplified author flow
        run: |
          grep -Fq 'トップへ戻る' src/faithful-cover-v11-r12.js
          grep -Fq '自動で下書き保存されます。' src/faithful-cover-v11-r12.js
          grep -Fq '写真は任意です。' src/faithful-cover-v11-r12.js
          grep -Fq 'この内容で提出する' src/faithful-cover-v11-r12.js
          grep -Fq 'rppOrgDetail' src/faithful-cover-v11-r15.js
          grep -Fq 'r15-legacy-org' src/faithful-cover-v11-r15.js
          grep -Fq 'syncPreviewPhoto' src/faithful-cover-v11-r15.js
          grep -Fq 'schedulePreviewPhoto' src/faithful-cover-v11-r15.js
          grep -Fq "observe(editor,{childList:true,subtree:true})" src/faithful-cover-v11-r15.js
      - name: Verify six-digit author code and production hardening
        run: |
          grep -Fq 'function random6()' src/faithful-cover-v11-r11.js
          grep -Fq "code.length!==6" src/faithful-cover-v11-r11.js
          grep -Fq "code.length!==6" src/faithful-cover-v11-r5.js
          grep -Fq 'この6桁コードを使用します' src/faithful-cover-v11-r5.js
          grep -Fq 'attempts>=8' src/faithful-cover-v11-r11.js
          grep -Fq 'rpp_story_revisions' src/faithful-cover-v11-r10.js
          grep -Fq '300-STORY SCALE REGRESSION PASSED' scripts/scale_300_regression.py
          grep -Fq 'FULL PRODUCT QA PASSED' scripts/full_product_qa.py
      - name: Verify Brevo free-plan email path
        run: |
          grep -Fq 'BREVO_API_KEY' src/faithful-cover-v11-r15.js
          grep -Fq "data.emailProvider=data.emailConfigured?'brevo':'none'" src/faithful-cover-v11-r15.js
          grep -Fq 'data.freePlanCompatible=true' src/faithful-cover-v11-r15.js
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.send_email) process.exit(1); console.log('No paid Cloudflare Email Service binding')"
      - name: Verify Worker routing
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.main!=='src/faithful-cover-v11-r15.js') process.exit(1); console.log('faithful-v11 r15.4 brevo-free active')"
      - name: Optional Cloudflare Worker dry-run
        run: timeout 45s npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist || echo 'Wrangler network check skipped; static checks passed.'

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare when repository secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Cloudflare API token not configured; relying on existing Git integration.'; exit 0; fi
          timeout 120s npx --yes wrangler@4 deploy

  live-smoke:
    if: github.event_name == 'push'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - name: Wait for faithful v11 r15.4 public deployment
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 8 "$RPP_BASE_URL/version.json?v11r154=${GITHUB_RUN_ID}-$i" | grep -Fq '2026.09.06-faithful-v11-r15.4-brevo-free'; then exit 0; fi
            sleep 10
          done
          exit 1
      - run: bash scripts/smoke-live.sh

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Detect live mode
        run: |
          MODE=$(curl -fsS "$RPP_BASE_URL/api/health?mode=${GITHUB_RUN_ID}" | python3 -c "import json,sys; x=json.load(sys.stdin); print('preview' if x.get('preview') is True else 'production')")
          echo "RPP_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Live mode: $MODE"
      - name: Production public browser smoke
        if: env.RPP_MODE == 'production'
        run: |
          timeout 90s python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          base=os.environ['RPP_BASE_URL']
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--lang=ja-JP');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,20)
          try:
              d.get(base+'/?prod-browser=1')
              w.until(EC.visibility_of_element_located((By.ID,'pw')))
              assert d.find_element(By.ID,'unlock').is_displayed()
              assert d.execute_script('return document.documentElement.scrollWidth<=document.documentElement.clientWidth+2')
              d.save_screenshot('artifacts/screens/production-viewer-gate.png')
              d.get(base+'/author.html?prod-browser=1')
              w.until(EC.visibility_of_element_located((By.ID,'auth')))
              assert d.find_element(By.ID,'email').is_displayed()
              d.save_screenshot('artifacts/screens/production-author-auth.png')
              d.get(base+'/admin.html?prod-browser=1')
              w.until(EC.visibility_of_element_located((By.ID,'login')))
              assert d.find_element(By.ID,'password').is_displayed()
              print('PRODUCTION PUBLIC BROWSER SMOKE PASSED')
          finally:
              d.quit()
          PY
      - name: Full current-product browser QA
        if: env.RPP_MODE == 'preview'
        run: timeout 180s python -u scripts/full_product_qa.py
      - name: Exercise 300-story scale
        if: env.RPP_MODE == 'preview'
        run: timeout 120s python -u scripts/scale_300_regression.py
      - name: Cache refresh smoke
        if: env.RPP_MODE == 'preview'
        run: python scripts/cache_refresh_smoke.py
      - name: Faithful cover smoke
        if: env.RPP_MODE == 'preview'
        run: python scripts/faithful_v11_smoke.py
      - name: Logout smoke
        if: env.RPP_MODE == 'preview'
        run: python scripts/logout_smoke.py
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
