name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/faithful-cover-v11-r31.js
          node --check src/faithful-cover-v11-r30.js
          node --check src/faithful-cover-v11-r29.js
          node --check src/faithful-cover-v11-r28.js
          node --check src/faithful-cover-v11-r27.js
          node --check src/faithful-cover-v11-r26.js
          node --check src/faithful-cover-v11-r25.js
          node --check src/faithful-cover-v11-r19.js
          node --check src/faithful-cover-v11-r17.js
          node --check src/faithful-cover-v11-r15.js
          node --check src/faithful-cover-v11-r14.js
          node --check src/faithful-cover-v11-r13.js
          node --check src/faithful-cover-v11-r12.js
          node --check src/faithful-cover-v11-r11.js
          node --check src/faithful-cover-v11-r10.js
          python -m py_compile scripts/cache_refresh_smoke.py scripts/faithful_v11_smoke.py scripts/logout_smoke.py scripts/full_product_qa.py scripts/full_product_qa_r26.py scripts/scale_300_regression.py
      - name: Verify r31 first-time author guide
        run: |
          grep -Fq "import app from './faithful-cover-v11-r30.js'" src/faithful-cover-v11-r31.js
          grep -Fq "data-rpp-first-time-guide','r31-stable'" src/faithful-cover-v11-r31.js
          grep -Fq '初めての方' src/faithful-cover-v11-r31.js
          grep -Fq 'メールアドレスを入力し、「認識コードを送信」を押してください。' src/faithful-cover-v11-r31.js
          grep -Fq 'observer.observe(auth,{childList:true})' src/faithful-cover-v11-r31.js
          grep -Fq '#auth #rppRecognitionHelp{display:none!important}' src/faithful-cover-v11-r31.js
      - name: Verify r30 author polish
        run: |
          grep -Fq "import app from './faithful-cover-v11-r29.js'" src/faithful-cover-v11-r30.js
          grep -Fq "data-rpp-author-polish','r30'" src/faithful-cover-v11-r30.js
          grep -Fq "変更内容を再提出する" src/faithful-cover-v11-r30.js
          grep -Fq "変更内容を保存" src/faithful-cover-v11-r30.js
          grep -Fq "#editor label" src/faithful-cover-v11-r30.js
      - name: Verify r29 saved-edit and resubmit guard
        run: |
          grep -Fq "import app from './faithful-cover-v11-r28.js'" src/faithful-cover-v11-r29.js
          grep -Fq 'rpp_story_working_drafts' src/faithful-cover-v11-r29.js
          grep -Fq 'X-RPP-Story-Intent' src/faithful-cover-v11-r29.js
          grep -Fq "storyIntent='edit-draft'" src/faithful-cover-v11-r29.js
          grep -Fq "storyIntent='submit'" src/faithful-cover-v11-r29.js
          grep -Fq "save.textContent='変更内容を保存'" src/faithful-cover-v11-r29.js
          grep -Fq "再提出するまでは掲載内容は変わりません" src/faithful-cover-v11-r29.js
          grep -Fq "const phrase='原文のまま掲載'" src/faithful-cover-v11-r29.js
          grep -Fq "data-rpp-submission-guard','r29'" src/faithful-cover-v11-r29.js
      - name: Verify r28 logged-out re-edit fix
        run: |
          grep -Fq "import app from './faithful-cover-v11-r27.js'" src/faithful-cover-v11-r28.js
          grep -Fq 'rppEditEmail' src/faithful-cover-v11-r28.js
          grep -Fq '/api/edit-code/login' src/faithful-cover-v11-r28.js
          grep -Fq "typeof openEditor!=='function'" src/faithful-cover-v11-r28.js
          grep -Fq "data-rpp-reedit-fix','r28'" src/faithful-cover-v11-r28.js
      - name: Verify r27 no-reload re-edit flow
        run: |
          grep -Fq "import app from './faithful-cover-v11-r26.js'" src/faithful-cover-v11-r27.js
          grep -Fq "data-rpp-reedit','r27'" src/faithful-cover-v11-r27.js
          grep -Fq "typeof openEditor==='function'" src/faithful-cover-v11-r27.js
          grep -Fq "await openEditor()" src/faithful-cover-v11-r27.js
          ! grep -Fq "location.reload()" src/faithful-cover-v11-r27.js
      - name: Verify r26 auth schema hotfix
        run: |
          grep -Fq "import uiApp from './faithful-cover-v11-r25.js'" src/faithful-cover-v11-r26.js
          grep -Fq "import baseApp from './faithful-cover-v11-r19.js'" src/faithful-cover-v11-r26.js
          grep -Fq "DB.prepare('CREATE TABLE IF NOT EXISTS rpp_edit_codes" src/faithful-cover-v11-r26.js
          grep -Fq "DB.prepare('CREATE TABLE IF NOT EXISTS rpp_author_resets" src/faithful-cover-v11-r26.js
          grep -Fq 'storeOtpAsEditCode' src/faithful-cover-v11-r26.js
          grep -Fq 'data.editCodeSameAsOtp=true' src/faithful-cover-v11-r26.js
          grep -Fq '/api/admin/author-reset' src/faithful-cover-v11-r26.js
      - name: Verify r25 mobile UI and periodic meteors
        run: |
          grep -Fq 'data-rpp-mobile-compat' src/faithful-cover-v11-r25.js
          grep -Fq 'rpp-line' src/faithful-cover-v11-r25.js
          grep -Fq 'touch-action:manipulation' src/faithful-cover-v11-r25.js
          grep -Fq 'font-size:16px!important' src/faithful-cover-v11-r25.js
          grep -Fq '提出済みの原稿です。内容を変更して再提出できます。' src/faithful-cover-v11-r25.js
          grep -Fq '修正後、「変更内容を再提出する」を押すと、原稿が更新されます。' src/faithful-cover-v11-r25.js
          grep -Fq 'rppR25MeteorSky' src/faithful-cover-v11-r25.js
          grep -Fq 'prefers-reduced-motion:reduce' src/faithful-cover-v11-r25.js
          ! grep -Fq 'MutationObserver' src/faithful-cover-v11-r25.js
      - name: Verify existing safety and Brevo path
        run: |
          grep -Fq 'attempts>=8' src/faithful-cover-v11-r11.js
          grep -Fq 'rpp_story_revisions' src/faithful-cover-v11-r10.js
          grep -Fq 'email_delivery_verified_at' src/faithful-cover-v11-r15.js
          grep -Fq 'smtp/statistics/events' src/faithful-cover-v11-r15.js
          grep -Fq 'saveCurrentMailSettings' src/faithful-cover-v11-r16.js
      - name: Verify active build and routing
        run: |
          grep -Fq '2026.09.08-faithful-v11-r27-reedit-stable' public/version.json
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.main!=='src/faithful-cover-v11-r31.js') process.exit(1); if(c.send_email) process.exit(1); console.log('r31 active')"
      - name: Cloudflare Worker dry-run
        run: timeout 45s npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to Cloudflare when repository secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Cloudflare API token not configured; relying on existing Git integration.'; exit 0; fi
          timeout 120s npx --yes wrangler@4 deploy

  live-smoke:
    if: github.event_name == 'push'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - name: Wait for r31 public deployment
        run: |
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r31=${GITHUB_RUN_ID}-$i" | grep -Fq 'data-rpp-first-time-guide="r31-stable"'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify r31 is live
        run: |
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r31=${GITHUB_RUN_ID}" | grep -Fq 'data-rpp-first-time-guide="r31-stable"'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r31=${GITHUB_RUN_ID}" | grep -Fq '初めての方'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r31=${GITHUB_RUN_ID}" | grep -Fq 'data-rpp-author-polish="r30"'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r31=${GITHUB_RUN_ID}" | grep -Fq 'data-rpp-submission-guard="r29"'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/author.html?r31=${GITHUB_RUN_ID}" | grep -Fq 'data-rpp-reedit-fix="r28"'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/?r31=${GITHUB_RUN_ID}" | grep -Fq 'data-rpp-viewer-cleanup="r29"'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/admin.html?r31=${GITHUB_RUN_ID}" | grep -Fq '投稿者登録をリセット'
          curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$RPP_BASE_URL/?r31=${GITHUB_RUN_ID}" | grep -Fq 'data-r25-stars="periodic"'
      - run: bash scripts/smoke-live.sh

  production-300-read-burst:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import concurrent.futures, time, urllib.request
          base='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          urls=[base+'/?load=300']*100+[base+'/author.html?load=300']*100+[base+'/api/health?load=300']*100
          def hit(u):
              t=time.perf_counter();req=urllib.request.Request(u,headers={'User-Agent':'RPP-300-read-QA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=12) as r:return r.status,(time.perf_counter()-t)*1000
          start=time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as ex:results=list(ex.map(hit,urls))
          elapsed=(time.perf_counter()-start)*1000;bad=[x for x in results if x[0]!=200];times=sorted(x[1] for x in results);p95=times[int(len(times)*.95)-1]
          print(f'300 requests: failures={len(bad)} total={elapsed:.0f}ms p95={p95:.0f}ms max={max(times):.0f}ms')
          assert not bad;assert p95 < 10000
          PY

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: echo "RPP_BASE_URL=https://road-to-peace-pride.hn-kikuchi.workers.dev" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Chrome mobile interaction smoke
        run: |
          timeout 90s python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          base=os.environ['RPP_BASE_URL'];o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--lang=ja-JP');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,20)
          try:
              d.get(base+'/author.html?prod-browser-r31=1');w.until(EC.visibility_of_element_located((By.ID,'auth')))
              assert d.find_element(By.TAG_NAME,'html').get_attribute('data-rpp-mobile-compat')=='r25'
              assert d.find_element(By.TAG_NAME,'html').get_attribute('data-rpp-reedit-fix')=='r28'
              assert d.find_element(By.TAG_NAME,'html').get_attribute('data-rpp-submission-guard')=='r29'
              assert d.find_element(By.TAG_NAME,'html').get_attribute('data-rpp-author-polish')=='r30'
              assert d.find_element(By.TAG_NAME,'html').get_attribute('data-rpp-first-time-guide')=='r31-stable'
              assert d.find_element(By.ID,'rppFirstTimeGuide').is_displayed()
              assert '初めての方' in d.find_element(By.ID,'rppFirstTimeGuide').text
              assert d.find_element(By.ID,'rppEditEmail').is_displayed()
              d.find_element(By.ID,'send').click();w.until(lambda x:'メールアドレスを入力してください' in x.find_element(By.ID,'authmsg').text)
              assert d.execute_script('return document.documentElement.scrollWidth<=document.documentElement.clientWidth+2')
              d.save_screenshot('artifacts/screens/production-author-r31-chrome.png');print('R31 CHROME MOBILE INTERACTION PASSED')
          finally:d.quit()
          PY
      - name: Install WebKit Safari test browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: iPhone Safari and LINE WebView interaction smoke
        run: |
          timeout 180s node <<'JS'
          const {webkit,devices}=require('playwright');const base=process.env.RPP_BASE_URL;
          (async()=>{const browser=await webkit.launch({headless:true}),iphone=devices['iPhone 13'];const cases=[{name:'safari',opts:{...iphone}},{name:'line',opts:{...iphone,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Line/15.15.0'}}];
            try{for(const c of cases){const context=await browser.newContext(c.opts),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto(base+'/author.html?r31-'+c.name+'=1',{waitUntil:'domcontentloaded'});await page.waitForSelector('#auth',{state:'visible'});const compat=await page.getAttribute('html','data-rpp-mobile-compat');if(compat!=='r25')throw new Error('missing mobile compat');const fix=await page.getAttribute('html','data-rpp-reedit-fix');if(fix!=='r28')throw new Error('missing r28 reedit fix');const guard=await page.getAttribute('html','data-rpp-submission-guard');if(guard!=='r29')throw new Error('missing r29 submission guard');const polish=await page.getAttribute('html','data-rpp-author-polish');if(polish!=='r30')throw new Error('missing r30 author polish');const guide=await page.getAttribute('html','data-rpp-first-time-guide');if(guide!=='r31-stable')throw new Error('missing r31 stable first-time guide');if(!await page.locator('#rppFirstTimeGuide').isVisible())throw new Error('first-time guide not visible');if(!await page.locator('#rppFirstTimeGuide').textContent().then(t=>t.includes('初めての方')))throw new Error('first-time guide text mismatch');if(!await page.locator('#rppEditEmail').isVisible())throw new Error('missing edit email');const classes=await page.getAttribute('html','class')||'';if(!classes.includes('rpp-ios'))throw new Error(c.name+' missing iOS class');if(c.name==='line'&&!classes.includes('rpp-line'))throw new Error('LINE class missing');await page.tap('#send');await page.waitForFunction(()=>document.querySelector('#authmsg')?.textContent.includes('メールアドレスを入力してください'));await page.waitForTimeout(500);if(errors.length)throw new Error(c.name+' page errors: '+errors.join(' | '));if(!await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+2))throw new Error(c.name+' horizontal overflow');await page.screenshot({path:'artifacts/screens/production-author-r31-'+c.name+'.png',fullPage:true});await context.close();console.log('R31 '+c.name.toUpperCase()+' INTERACTION PASSED')}}finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-r31-ios-line
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
