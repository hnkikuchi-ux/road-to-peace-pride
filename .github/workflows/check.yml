name: Validate memorial app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: memorial-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/rpp-worker.js
          node --check src/secure-worker.js
          node --check src/ui-enhancer.js
          node --check src/top-bg-enhancer.js
          node --check src/motion-enhancer.js
          node --check src/responsive-enhancer.js
          node --check src/final-polish-v2.js
          node --check src/touch-safety.js
          node --check src/exact-cover.js
          node --check src/exact-cover-avif.js
          node --check src/visual-final.js
          node --check public/zip-store.js
      - name: Verify required public files
        run: |
          test -f public/index.html
          test -f public/author.html
          test -f public/admin.html
          test -f public/status.html
          test -f public/version.json
          test -f public/zip-store.js
          test -f public/assets/mobile-dawn.svg
          test -f public/assets/desktop-dawn.svg
          test -f public/assets/top-master/01.txt
          test -f public/assets/top-master/02.txt
          test -f public/assets/top-master/03.txt
          for n in 001 002 003 004 005 006 007 008 009; do test -f "public/assets/top-master-avif/$n.txt"; done
          test "$(wc -c < public/assets/top-master-avif/001.txt)" -eq 20000
          test "$(wc -c < public/assets/top-master-avif/007.txt)" -eq 20000
          test "$(wc -c < public/assets/top-master-avif/008.txt)" -eq 19999
          test "$(wc -c < public/assets/top-master-avif/009.txt)" -eq 13940
          test -f scripts/smoke-live.sh
          test -f scripts/browser_smoke.py
          test -f scripts/ux_regression.py
          test -f scripts/motion_smoke.py
      - name: Verify crisp vector cover wiring
        run: |
          grep -Fq "import app from './touch-safety.js'" src/exact-cover.js
          grep -Fq '941/1672' src/exact-cover.js
          grep -Fq '記録をひらく' src/exact-cover.js
          grep -Fq "import app from './exact-cover.js'" src/exact-cover-avif.js
          grep -Fq "/assets/mobile-dawn.svg" src/exact-cover-avif.js
          grep -Fq 'PRIVATE ONLINE BOOK' src/exact-cover-avif.js
          grep -Fq 'rppCrispCopy' src/exact-cover-avif.js
          grep -Fq 'vector-live-941x1672' src/exact-cover-avif.js
          grep -Fq '私の記録を綴る / WRITE YOUR STORY' src/exact-cover-avif.js
          grep -Fq 'WRITE YOUR STORY' src/exact-cover-avif.js
          grep -Fq 'prefers-reduced-motion' src/exact-cover-avif.js
          grep -Fq "import app from './exact-cover-avif.js'" src/visual-final.js
          grep -Fq 'visualFinal' src/visual-final.js
          grep -Fq 'white-space:nowrap' src/visual-final.js
      - name: Verify premium motion and polish system
        run: |
          grep -Fq "import app from './top-bg-enhancer.js'" src/motion-enhancer.js
          grep -Fq "import app from './motion-enhancer.js'" src/responsive-enhancer.js
          grep -Fq "import app from './responsive-enhancer.js'" src/final-polish-v2.js
          grep -Fq "import app from './final-polish-v2.js'" src/touch-safety.js
          grep -Fq 'rppRipple' src/motion-enhancer.js
          grep -Fq 'prefers-reduced-motion' src/motion-enhancer.js
          grep -Fq 'rpp-pressed' src/motion-enhancer.js
          grep -Fq 'rpp-feedback' src/final-polish-v2.js
          ! grep -Fq "observe(document.documentElement" src/final-polish-v2.js
      - name: Verify admin has no third-party JavaScript
        run: |
          ! grep -Eiq '<script[^>]+src=["'\'']https?://' public/admin.html
          grep -Fq 'src="./zip-store.js"' public/admin.html
      - name: Exercise built-in ZIP writer
        run: |
          node -e "import('./public/zip-store.js').then(async()=>{const b=await globalThis.RppZip.makeZip([{name:'test.txt',data:'ok'}]);const u=new Uint8Array(await b.arrayBuffer());if(u[0]!==0x50||u[1]!==0x4b||u[2]!==0x03||u[3]!==0x04)process.exit(1);console.log('ZIP writer OK',u.length)})"
      - name: Verify security and UI enhancer routing
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); if(c.name!=='road-to-peace-pride') process.exit(1); if(c.main!=='src/visual-final.js') process.exit(1); for(const p of ['/', '/index.html', '/author', '/author.html', '/status']) if(!c.assets.run_worker_first.includes(p)) process.exit(1); console.log('road-to-peace-pride + final visual polish + crisp vector live cover active')"
          grep -Fq "path==='/author'||path==='/author.html'" src/ui-enhancer.js
          grep -Fq '写真（任意・1枚まで）' src/ui-enhancer.js
          grep -Fq 'この端末に、クラウドより新しい下書きがあります' src/ui-enhancer.js
          grep -Fq '提出済みのまま' src/ui-enhancer.js
          grep -Fq '題名・氏名で検索' src/ui-enhancer.js
          grep -Fq 'pointer-events:none' src/touch-safety.js
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/rpp-dist

  live-smoke:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public URL
        run: |
          NEW='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          OLD='https://giin-home-cloud-pilot.hn-kikuchi.workers.dev'
          if curl -fsS --max-time 8 "$NEW/version.json?probe=${GITHUB_RUN_ID}" >/dev/null 2>&1; then BASE="$NEW"; else BASE="$OLD"; fi
          echo "RPP_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Testing public URL: $BASE"
      - name: Exercise deployed Cloudflare site end to end
        run: bash scripts/smoke-live.sh

  mobile-browser:
    if: github.event_name == 'push'
    needs: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public URL
        run: |
          NEW='https://road-to-peace-pride.hn-kikuchi.workers.dev'
          OLD='https://giin-home-cloud-pilot.hn-kikuchi.workers.dev'
          if curl -fsS --max-time 8 "$NEW/version.json?probe=${GITHUB_RUN_ID}" >/dev/null 2>&1; then BASE="$NEW"; else BASE="$OLD"; fi
          echo "RPP_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Testing public URL: $BASE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Japanese fonts and Selenium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Exercise mobile UI in headless Chrome
        run: python scripts/browser_smoke.py
      - name: Exercise optional photo, TOC search, and submitted-safe save
        run: python scripts/ux_regression.py
      - name: Exercise exact cover motion and desktop preservation
        run: python scripts/motion_smoke.py
      - name: Upload mobile and desktop visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
