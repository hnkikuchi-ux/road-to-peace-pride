name: One-time reset test author

on:
  push:
    branches: [main]
    paths:
      - 'ops/reset-hn-kikuchi.trigger'

permissions:
  contents: read

jobs:
  reset-author:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset hn.kikuchi@gmail.com in production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Cloudflare credentials are not configured.'
            exit 1
          fi
          EMAIL='hn.kikuchi@gmail.com'
          echo 'Existing registration summary:'
          npx --yes wrangler@4 d1 execute giin-home-db --remote --command "SELECT author_email,status,photo_key FROM rpp_stories WHERE lower(author_email)=lower('$EMAIL'); SELECT COUNT(*) AS revisions FROM rpp_story_revisions WHERE lower(author_email)=lower('$EMAIL'); SELECT COUNT(*) AS edit_codes FROM rpp_edit_codes WHERE lower(email)=lower('$EMAIL'); SELECT COUNT(*) AS sessions FROM rpp_sessions WHERE kind='author' AND lower(subject)=lower('$EMAIL');"
          echo 'Resetting registration...'
          npx --yes wrangler@4 d1 execute giin-home-db --remote --command "CREATE TABLE IF NOT EXISTS rpp_author_resets(email TEXT PRIMARY KEY,reset_at TEXT NOT NULL); DELETE FROM rpp_sessions WHERE kind='author' AND lower(subject)=lower('$EMAIL'); DELETE FROM rpp_otps WHERE lower(email)=lower('$EMAIL'); DELETE FROM rpp_edit_codes WHERE lower(email)=lower('$EMAIL'); DELETE FROM rpp_story_revisions WHERE lower(author_email)=lower('$EMAIL'); DELETE FROM rpp_stories WHERE lower(author_email)=lower('$EMAIL'); INSERT INTO rpp_author_resets(email,reset_at) VALUES('$EMAIL',datetime('now')) ON CONFLICT(email) DO UPDATE SET reset_at=excluded.reset_at;"
          echo 'Post-reset verification:'
          npx --yes wrangler@4 d1 execute giin-home-db --remote --command "SELECT (SELECT COUNT(*) FROM rpp_stories WHERE lower(author_email)=lower('$EMAIL')) AS stories,(SELECT COUNT(*) FROM rpp_story_revisions WHERE lower(author_email)=lower('$EMAIL')) AS revisions,(SELECT COUNT(*) FROM rpp_edit_codes WHERE lower(email)=lower('$EMAIL')) AS edit_codes,(SELECT COUNT(*) FROM rpp_otps WHERE lower(email)=lower('$EMAIL')) AS otps,(SELECT COUNT(*) FROM rpp_sessions WHERE kind='author' AND lower(subject)=lower('$EMAIL')) AS sessions,(SELECT COUNT(*) FROM rpp_author_resets WHERE lower(email)=lower('$EMAIL')) AS reset_marker;"
