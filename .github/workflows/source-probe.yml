name: Probe rendered top source
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Print rendered source around browser error
        env:
          RPP_BASE_URL: https://road-to-peace-pride.hn-kikuchi.workers.dev
        run: python scripts/source_probe.py
