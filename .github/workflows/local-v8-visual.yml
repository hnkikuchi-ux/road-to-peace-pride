name: Local faithful v11 visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-v11-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SETUP_KEY: local-r26-test-key-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Worker and browser test dependencies
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium==4.35.0
      - name: Start current Worker locally
        run: |
          nohup ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8787 >/tmp/rpp-wrangler.log 2>&1 &
          echo $! >/tmp/rpp-wrangler.pid
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8787/version.json >/dev/null 2>&1; then echo 'Local Worker is ready.'; exit 0; fi
            if ! kill -0 "$(cat /tmp/rpp-wrangler.pid)" 2>/dev/null; then cat /tmp/rpp-wrangler.log || true; exit 1; fi
            sleep 2
          done
          cat /tmp/rpp-wrangler.log || true
          exit 1
      - name: Verify cover geometry and periodic shooting stars
        env:
          RPP_BASE_URL: http://127.0.0.1:8787
        run: python scripts/faithful_v11_smoke.py
      - name: Full r27 author-submit-reedit lifecycle
        env:
          RPP_BASE_URL: http://127.0.0.1:8787
        run: timeout 240s python -u scripts/full_product_qa_r27.py
      - name: Exercise 300-story rendering and navigation
        env:
          RPP_BASE_URL: http://127.0.0.1:8787
        run: timeout 150s python -u scripts/scale_300_regression.py
      - name: Keep all six contents chapters when no stories are published
        env:
          RPP_BASE_URL: http://127.0.0.1:8787
        run: timeout 90s python -u scripts/empty_contents_regression.py
      - name: Show Worker log on failure
        if: failure()
        run: cat /tmp/rpp-wrangler.log || true
      - name: Upload local QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-r27-full-qa
          path: artifacts/screens
          if-no-files-found: warn
          retention-days: 7
