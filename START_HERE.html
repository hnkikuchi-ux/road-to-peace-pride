<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>議員ホーム｜ワンクリック公開</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17324a;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #dce6ef;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(28,54,83,.1)}h1{font-size:30px;margin:0 0 12px}.lead{font-size:17px;line-height:1.8}.step{display:flex;gap:14px;margin:18px 0;padding:16px;border-radius:16px;background:#f1f6fb}.num{width:32px;height:32px;border-radius:50%;background:#0f3d66;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.button{display:block;text-align:center;margin-top:24px;padding:17px 20px;border-radius:14px;background:#f48120;color:#fff;text-decoration:none;font-weight:900;font-size:18px}.note{margin-top:18px;padding:14px;border-radius:14px;background:#fff8e8;line-height:1.7}code{overflow-wrap:anywhere}
  </style>
</head>
<body><main class="wrap"><section class="card">
  <h1>議員ホームを公開する</h1>
  <p class="lead">PowerShellは使いません。GitHubへファイルを入れた後、Cloudflareのボタンを押して管理者パスワードを決めるだけです。</p>
  <div class="step"><span class="num">1</span><div><strong>このフォルダの中身をGitHubへアップロード</strong><br><code>hnkikuchi-ux/giin-home-free</code> に上書きします。</div></div>
  <div class="step"><span class="num">2</span><div><strong>下のボタンを押す</strong><br>D1・KV・データベースの表はCloudflareが自動作成します。</div></div>
  <div class="step"><span class="num">3</span><div><strong>SETUP_KEYを決めて公開</strong><br>公開後、URLの末尾に <code>/setup.html</code> を付けます。</div></div>
  <a class="button" href="https://deploy.workers.cloudflare.com/?url=https://github.com/hnkikuchi-ux/giin-home-free" target="_blank" rel="noopener">Cloudflareで公開する</a>
  <div class="note">先にGitHubへのアップロードを完了してから、このボタンを押してください。</div>
</section></main></body></html>
